      render();
    });
  });
}

function renderIsoList(points){
  const el = document.getElementById('isoList');
  if(!points.length){ el.innerHTML='<div class="empty-state">No isolation points.</div>'; return; }
  el.innerHTML = points.map(p=>`<div class="iso-item"><b>${elName(p)}</b><br>open — blocking power to part of the network</div>`).join('');
}
function renderParallelList(nodes){
  const el = document.getElementById('parList');
  if(!nodes.length){ el.innerHTML='<div class="empty-state">No paralleled sections.</div>'; return; }
  el.innerHTML = `<div class="parallel-item"><b>${nodes.length} node(s)</b> fed by 2+ sources simultaneously</div>`;
}

function render(){
  const {visited, reachBy, edges} = computeEnergization();
  const nodeColor = computeFeederColoring(visited);
  const isoPts = findIsolationPoints(visited, edges);
  const isoSet = new Set(isoPts);
  const parallelNodes = findParallelNodes(reachBy);

  const vw = CANVAS_W / vZoom, vh = CANVAS_H / vZoom;
  let svg = `<svg id="mainSvg" style="width:100%;height:100%;display:block;" viewBox="${vPanX} ${vPanY} ${vw} ${vh}">`;

  svg += renderLegend();

  // ── Smooth outline around de-energized region ──────────────────────────
  // Collect all de-energized line points, cluster them into connected
  // groups, compute a convex hull per group, expand outward, and draw
  // as a single smooth closed dashed path.
  if(showDeenergizedOutline)(()=>{
    const dePts = [];
    for(const ln of lines){
      const {color} = lineStroke(ln, visited, reachBy, nodeColor);
      if(color !== '#7a8fa8') continue;
      ln.points.forEach(p => dePts.push({x:p.x, y:p.y}));
    }
    if(dePts.length < 3) return;

    const hull = convexHull(dePts);
    if(hull.length < 3) return;

    // Expand each hull vertex outward from the centroid
    const PAD = 44;
    const cx = hull.reduce((s,p)=>s+p.x,0)/hull.length;
    const cy = hull.reduce((s,p)=>s+p.y,0)/hull.length;
    const expanded = hull.map(p=>{
      const dx=p.x-cx, dy=p.y-cy;
      const d=Math.hypot(dx,dy)||1;
      return {x: p.x+dx/d*PAD, y: p.y+dy/d*PAD};
    });

    svg += `<path d="${smoothClosedPath(expanded)}" fill="none" stroke="#ff5d5d" stroke-width="3" stroke-dasharray="10,7" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>`;
  })();

  // Main lines with energization colour
  for(const ln of lines){
    if(isLineHidden(ln)) continue;
    const pts = ln.points.map(p=>`${p.x},${p.y}`).join(' ');
    const {color, width} = lineStroke(ln, visited, reachBy, nodeColor);
    svg += `<polyline data-line-id="${ln.id}" points="${pts}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round"/>`;
  }

  if(lineDraft){
    const pts = lineDraft.points.map(p=>`${p.x},${p.y}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>`;
    svg += `<polyline id="rubberLine" points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2,3" opacity="0.7" stroke-linecap="round"/>`;
    for(const p of lineDraft.points) svg += `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--accent)"/>`;
  } else {
    svg += `<polyline id="rubberLine" points="0,0" fill="none" stroke="none"/>`;
  }

  // Pass 1: element glyphs and hit areas
  for(const el of elements){
    if(isElementHidden(el)) continue;
    const def = TYPES[el.type];
    const rot = el.rotation || 0;
    const cursor = activeTool==='delete' ? 'not-allowed' : activeTool==='rotate' ? 'alias' : 'default';
    svg += `<g data-el-id="${el.id}" style="cursor:${cursor}" transform="rotate(${rot},${el.x},${el.y})">`;
    svg += hitAreaFor(el);
    svg += glyphFor(el, isoSet, visited, reachBy);
    svg += `</g>`;
  }

  // Pass 2: labels rendered on top of all glyphs so nothing covers them
  for(const el of elements){
    if(isElementHidden(el)) continue;
    const def = TYPES[el.type];
    const rot = el.rotation || 0;
    if(def.kind === 'junction') continue;
    if(def.kind === 'textBox'){
      const tText = el.name || '+ click to add text';
      const hasText = !!el.name;
      const off = el.labelOffset || {x:0, y:0};
      const tx = el.x + off.x, ty2 = el.y + off.y;
      const isSelect = activeTool === 'select';
      const fs = el.labelFontSize||10;
      const blockH = textBlockHeight(tText, fs);
      svg += `<g transform="rotate(${rot},${tx},${ty2})">
        <g class="name-toggle" data-name-el="${el.id}" data-label-el="${el.id}" data-x="${tx}" data-y="${ty2}"
          style="cursor:${activeTool==='delete'?'not-allowed': isSelect?'move':'text'}">
          <rect x="${tx-60}" y="${ty2-blockH/2-4}" width="120" height="${blockH+8}" rx="2" fill="transparent"/>
          ${svgMultilineText(tx, ty2+4, tText, fs, `text-anchor="middle" font-family="var(--mono)" style="font-size:${fs}px" fill="${hasText ? '#e6edf7' : '#5a6e8f'}"`)}
        </g>
      </g>`;
      continue;
    }
    const text = el.name || def.label.toUpperCase();
    const ly = labelY(el);
    const off = el.labelOffset || {x:0, y:0};
    const lx = el.x + off.x, lly = ly + off.y;
    const isSelect = activeTool === 'select';
    const fs = el.labelFontSize||10;
    const blockH = textBlockHeight(text, fs);
    svg += `<g class="name-toggle" data-name-el="${el.id}" data-label-el="${el.id}" data-x="${lx}" data-y="${lly}">
      <rect x="${lx-60}" y="${lly-blockH/2-2}" width="120" height="${blockH+6}" rx="2" fill="transparent" style="cursor:${isSelect?'move':'default'}"/>
      ${svgMultilineText(lx, lly, text, fs, `class="el-label name-text" fill="#c8d8f0" style="font-size:${fs}px;cursor:${isSelect?'move':'text'}"`)}
    </g>`;
  }

  // Selection highlights
  if(activeTool === 'select'){
    for(const id of selectedIds){
      const el = elements.find(e=>e.id===id);
      if(!el) continue;
      svg += `<circle cx="${el.x}" cy="${el.y}" r="30" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>`;
    }
    if(selectBox){
      const rx=Math.min(selectBox.x1,selectBox.x2), ry=Math.min(selectBox.y1,selectBox.y2);
      const rw=Math.abs(selectBox.x2-selectBox.x1), rh=Math.abs(selectBox.y2-selectBox.y1);
      svg += `<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="var(--accent)" opacity="0.08" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4,3"/>`;
    }
  }

  // Snap preview dots — updated by mousemove, not by render cycle
  svg += `<circle id="snapDot" cx="0" cy="0" r="5" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2,2" visibility="hidden"/>`;
  svg += `<circle id="placeDot" cx="0" cy="0" r="6" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3,2" visibility="hidden"/>`;

  svg += `</svg>`;
  // Preserve any active inline name editor across the re-render
  const activeWrap = document.getElementById('nameEditorWrap');
  stage.innerHTML = svg;
  if(activeWrap) stage.appendChild(activeWrap);
  stage.querySelector('svg').addEventListener('click', onStageClick);
  stage.querySelector('svg').addEventListener('mousemove', onStageMove);
  stage.querySelector('svg').addEventListener('mousedown', e=>{
    if(activeTool !== 'select') return;
    // Label drag takes priority
    const labelT = e.target.closest('[data-label-el]');
    if(labelT){
      const el = elements.find(el=>el.id===labelT.dataset.labelEl);
      if(el){
        const p = svgPoint(e);
        const off = el.labelOffset || {x:0,y:0};
        labelDragState = {elId:el.id, startMouseX:p.x, startMouseY:p.y, startOffX:off.x, startOffY:off.y};
        e.preventDefault(); e.stopPropagation();
        return;
      }
    }
    const p = svgPoint(e);
    const elTarget = e.target.closest('[data-el-id]');
    if(elTarget){
      const id = elTarget.dataset.elId;
      if(!selectedIds.has(id)){
        if(!e.shiftKey) selectedIds.clear();
        selectedIds.add(id);
        render();
      }
      const elSnapshots = {};
      elements.forEach(el=>{ if(selectedIds.has(el.id)) elSnapshots[el.id]={x:el.x, y:el.y}; });
      const lineSnapshots = lines.map(ln=>({ id:ln.id, points: ln.points.map(pt=>({x:pt.x, y:pt.y})) }));
      dragState = {startX:p.x, startY:p.y, elSnapshots, lineSnapshots};
      e.preventDefault();
    } else {
      if(!e.shiftKey) selectedIds.clear();
      selectBox = {x1:p.x, y1:p.y, x2:p.x, y2:p.y};
      render();
    }
  });
  stage.querySelector('svg').addEventListener('mouseup', ()=>{
    labelDragState = null;
    if(dragState){ dragState = null; render(); return; }
    if(selectBox){
      const minX=Math.min(selectBox.x1,selectBox.x2), maxX=Math.max(selectBox.x1,selectBox.x2);
      const minY=Math.min(selectBox.y1,selectBox.y2), maxY=Math.max(selectBox.y1,selectBox.y2);
      elements.forEach(el=>{
        if(el.x>=minX && el.x<=maxX && el.y>=minY && el.y<=maxY) selectedIds.add(el.id);
      });
      selectBox = null;
      render();
    }
  });

  renderIsoList(isoPts);
  renderParallelList(parallelNodes);
  renderFeederList();
}

// --- Shared diagram loader (used by both file upload and the bundled library) ---
function loadDiagramData(data, sourceName){
  if(!data.elements || !data.lines) throw new Error('Invalid diagram data');
  elements = data.elements;
  elements.forEach(el=>{ if(!el.labelOffset) el.labelOffset={x:0,y:0}; if(!el.rotation) el.rotation=0; if(!el.labelFontSize) el.labelFontSize=10; });
  lines = data.lines;
  nextId = data.nextId || (Math.max(0, ...elements.map(e=>parseInt(e.id.replace(/\D/g,''))||0), ...lines.map(l=>parseInt(l.id.replace(/\D/g,''))||0)) + 1);
  lineDraft = null;
  selectedIds.clear();
  logEvent(`Loaded diagram: ${sourceName}`, 'ok');
  render();
}

});

// Replace every CSS variable reference in SVG attributes/styles with a literal colour
const CSS_VAR_MAP = {
  '--energized':'#3ddc84', '--energized-dim':'#1f5d3c',
  '--deenergized':'#54627c', '--deenergized-dim':'#2a3450',
  '--isolation':'#ff5d5d', '--parallel':'#c084fc',
  '--accent':'#ffb547', '--ink':'#e6edf7',
  '--ink-dim':'#8ea0bd', '--ink-faint':'#5a6e8f',
  '--bg':'#0b1320', '--panel':'#121d33', '--panel-2':'#0f1729',
  '--line-grid':'#1c2942',
};
function inlineCssVars(node){
  if(node.nodeType !== 1) return;
  ['stroke','fill','style','filter'].forEach(attr=>{
    let val = node.getAttribute(attr);
    if(!val) return;
    Object.entries(CSS_VAR_MAP).forEach(([k,v])=>{
      val = val.replace(new RegExp('var\\('+k+'\\)','g'), v);
    });
    node.setAttribute(attr, val);
  });
  Array.from(node.childNodes).forEach(inlineCssVars);
}

function buildExportSvg(){
  // Compute tight bounding box
  const allX = [], allY = [];
  elements.forEach(el=>{ allX.push(el.x); allY.push(el.y); });
  lines.forEach(ln=> ln.points.forEach(p=>{ allX.push(p.x); allY.push(p.y); }));
  if(!allX.length) return null;

  const pad = 60;
  const minX = Math.min(...allX)-pad, minY = Math.min(...allY)-pad;
  const maxX = Math.max(...allX)+pad, maxY = Math.max(...allY)+pad;
  const W = maxX-minX, H = maxY-minY;

  const clone = stage.querySelector('svg').cloneNode(true);
  clone.setAttribute('viewBox', `${minX} ${minY} ${W} ${H}`);
  clone.removeAttribute('style');
  clone.querySelectorAll('#rubberLine,#snapDot,#placeDot').forEach(n=>n.remove());

  // Dark background rect
  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('x',minX); bg.setAttribute('y',minY);
  bg.setAttribute('width',W); bg.setAttribute('height',H);
  bg.setAttribute('fill','#0b1320');
  clone.insertBefore(bg, clone.firstChild);

  // Inline CSS variables so the SVG is self-contained
  inlineCssVars(clone);
  return {clone, W, H};
}

// --- Export PNG ---
document.getElementById('btn_export_png').addEventListener('click', ()=>{
  const result = buildExportSvg();
  if(!result){ alert('Nothing to export — add some elements first.'); return; }
  const {clone, W, H} = result;
  clone.setAttribute('width', W);
  clone.setAttribute('height', H);

  const svgStr = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = ()=>{
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = W*scale; canvas.height = H*scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob(b=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'network_diagram.png';
      a.click();
      logEvent('Exported as network_diagram.png (2× resolution)', 'ok');
    }, 'image/png');
  };
  img.onerror = ()=> alert('PNG export failed — try PDF instead.');
  img.src = url;
});

    btn.style.borderColor = '#3ddc84';

    const ts = new Date().toLocaleString();
    logEvent(`── Log started at ${ts} ──`, 'ok');
    logEvent('Initial state — elements currently OPEN:', 'ok');
    let foundAny = false;
    for(const el of elements){
      const def = TYPES[el.type];
      const name = el.name || def.label;
      if(def.kind==='switch' && el.state==='open'){
        logEvent(`  ${name}: OPEN`, 'blocked'); foundAny = true;
      }
      if(def.kind==='recloser'){
        const openParts = [];
        if(el.busSwitch==='open') openParts.push('bus isolator');
        if(el.breaker==='open') openParts.push('breaker');
        if(el.lineSwitch==='open') openParts.push('line isolator');
        if(el.bypass==='open') openParts.push('bypass');
        if(openParts.length){ logEvent(`  ${name}: OPEN (${openParts.join(', ')})`, 'blocked'); foundAny = true; }
      }
      if(def.kind==='source' && el.active===false){
        logEvent(`  ${name}: SOURCE INACTIVE`, 'blocked'); foundAny = true;
      }
    }
    if(!foundAny) logEvent('  All elements are CLOSED / energized', 'ok');
    logEvent('── User actions below ──', 'ok');

    btn.textContent = '▶ Start';
    btn.style.color = 'var(--ink-faint)';

const DIAGRAM_GROUPS = {
  'West Kings House': 'KSA-N',
  'Constant Spring': 'KSA-N',
  'Hope': 'KSA-N',
  'Up Park Camp': 'KSA-N',
  'Washington Boulevard': 'KSA-N',
  'Washington Boulevard 410': 'KSA-N',
  'Three Miles': 'KSA-S',
  'Cane River': 'KSA-S',
  'Duhaney': 'KSA-S',
  'Greenwich Road': 'KSA-S',
  'Hunts Bay': 'KSA-S',
  'Rockfort': 'KSA-S',
};

function buildLibraryPanel(){
  const names = Object.keys(BUNDLED_DIAGRAMS).sort();
  if(!names.length) return '<div style="padding:10px; font-size:11px; color:var(--ink-faint);">No bundled diagrams.</div>';

  // Group names, putting any ungrouped diagram under "Other"
  const groups = {};
  names.forEach(name=>{
    const g = DIAGRAM_GROUPS[name] || 'Other';
    if(!groups[g]) groups[g] = [];
    groups[g].push(name);
  });

  // Sort group labels alphabetically, but keep "Other" last if present
  const groupLabels = Object.keys(groups).sort((a,b)=>{
    if(a==='Other') return 1;
    if(b==='Other') return -1;
    return a.localeCompare(b);
  });

  return groupLabels.map((g, i)=>{
    const borderStyle = i===0 ? 'border-top:none; margin-top:0;' : 'border-top:1px solid var(--line-grid); margin-top:4px;';
    const header = `<div style="padding:6px 10px 3px; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); font-weight:600; ${borderStyle}">${g}</div>`;
    const items = groups[g].map(name=>{
      const d = BUNDLED_DIAGRAMS[name];
      const count = (d.elements||[]).length;
      return `<div class="library-item" data-lib-name="${name.replace(/"/g,'&quot;')}">
        <span>${name}</span>
        <span class="lib-count">${count} elements</span>
      </div>`;
    }).join('');
    return header + items;
  }).join('');
}

// ── Full symbol key: renders every element type using the real glyph
// functions (so it's an accurate picture, not a redrawn approximation) ──
function keyIconSvg(type, viewW, viewH, bodySvg){
  return `<svg class="key-icon" viewBox="0 0 ${viewW} ${viewH}">${bodySvg}</svg>`;
}

function buildFullKeyPanel(){
  const emptySet = new Set();
  const rows = [];

  function addRow(name, viewW, viewH, bodyFn, cxOverride, cyOverride){
    const cx = cxOverride!==undefined ? cxOverride : viewW/2;
    const cy = cyOverride!==undefined ? cyOverride : viewH/2;
    const body = bodyFn(cx, cy);
    rows.push(`<div class="key-row">${keyIconSvg(name, viewW, viewH, body)}<span class="key-name">${name}</span></div>`);
  }

  addRow('Source', 60, 50, (cx,cy)=> sourceGlyph({id:'k_src', x:cx, y:cy, active:true}));

  addRow('Load', 60, 50, (cx,cy)=>{
    const v = new Set(['k_load']);
    return loadGlyph({id:'k_load', x:cx, y:cy}, v, {});
  });

  addRow('Junction (T-tap)', 60, 50, (cx,cy)=>{
    const v = new Set(['k_junc']);
    return junctionGlyph({id:'k_junc', x:cx, y:cy}, v, {});
  });

  addRow('Main Recloser', 170, 130, (cx,cy)=> recloserExact(
    {id:'k_main', type:'mainRecloser', x:cx, y:cy, busSwitch:'closed', breaker:'closed', lineSwitch:'closed', bypass:'open', groundTripBypassed:false}, emptySet));

  addRow('Feeder Recloser', 140, 120, (cx,cy)=> recloserExact(
    {id:'k_feeder', type:'feederRecloser', x:cx, y:cy, busSwitch:'closed', breaker:'closed', lineSwitch:'closed', bypass:'open', groundTripBypassed:false}, emptySet));

  addRow('LCB', 140, 120, (cx,cy)=> recloserExact(
    {id:'k_lcb', type:'lcb', x:cx, y:cy, busSwitch:'closed', breaker:'closed', lineSwitch:'closed', bypass:'open', groundTripBypassed:false}, emptySet));

  addRow('Knife Switch', 100, 70, (cx,cy)=> switchBladeGlyph(
    {id:'k_knife', type:'knifeSwitch', x:cx, y:cy, state:'closed'}, emptySet));

  addRow('Jumper', 100, 70, (cx,cy)=> switchBladeGlyph(
    {id:'k_jump', type:'jumper', x:cx, y:cy, state:'closed'}, emptySet));

  // Tie Switch and Load Buster carry a status badge well above the blade
  // (sync-check relay / LB tag), so bias the vertical centre down to fit it.
  addRow('Tie Switch', 100, 90, (cx,cy)=> switchBladeGlyph(
    {id:'k_tie', type:'tieSwitch', x:cx, y:cy, state:'closed', syncOk:true}, emptySet), 50, 72);

  addRow('Load Buster', 100, 80, (cx,cy)=> switchBladeGlyph(
    {id:'k_lb', type:'loadBuster', x:cx, y:cy, state:'closed'}, emptySet), 50, 55);

  addRow('Fuse', 100, 60, (cx,cy)=> fuseGlyph(
    {id:'k_fuse', type:'fuse', x:cx, y:cy, state:'closed'}, emptySet));

  addRow('Tripsaver', 60, 60, (cx,cy)=> tripsaverGlyph(
    {id:'k_trip', type:'tripsaver', x:cx, y:cy, state:'closed'}, emptySet));

  addRow('Bus (accepts many connections along its length)', 100, 60, (cx,cy)=>{
    const c = '#3ddc84';
    return `<line x1="${cx}" y1="${cy-25}" x2="${cx}" y2="${cy+25}" stroke="${c}" stroke-width="4" stroke-linecap="round"/>
      <line x1="${cx-6}" y1="${cy-25}" x2="${cx+6}" y2="${cy-25}" stroke="#5a6e8f" stroke-width="2"/>
      <line x1="${cx-6}" y1="${cy+25}" x2="${cx+6}" y2="${cy+25}" stroke="#5a6e8f" stroke-width="2"/>`;
  });

  return rows.join('');
}

document.getElementById('btnFullKey').addEventListener('click', (e)=>{
  e.stopPropagation();
  const panel = document.getElementById('fullKeyPanel');
  const isOpen = panel.style.display !== 'none';
  if(isOpen){
    panel.style.display = 'none';
  } else {
    panel.innerHTML = buildFullKeyPanel();
    panel.style.display = 'block';
  }
});
document.addEventListener('click', (e)=>{
  const panel = document.getElementById('fullKeyPanel');
  const btn = document.getElementById('btnFullKey');
  if(panel.style.display!=='none' && !panel.contains(e.target) && e.target!==btn){
    panel.style.display = 'none';
  }
});

render();

// Register service worker for offline support + installability.
// Silently no-ops if served from file:// or a host without HTTPS,
// since Service Workers require a secure context — the app still
// works fine without it, just without offline caching / install prompt.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* not installable here, that's fine */ });
  });
}
</script>
