<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Distribution Network Builder</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1320">
<style>
  :root{
    --bg:#0b1320; --panel:#121d33; --panel-2:#0f1729; --line-grid:#1c2942;
    --ink:#e6edf7; --ink-dim:#8ea0bd; --ink-faint:#5a6e8f;
    --energized:#3ddc84; --energized-dim:#1f5d3c;
    --deenergized:#7a8fa8; --deenergized-dim:#2a3450;
    --isolation:#ff5d5d; --isolation-dim:#5a2030;
    --parallel:#c084fc; --parallel-dim:#3d2a5c;
    --accent:#ffb547; --accent-dim:#5a3f17;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--mono); font-size:13px;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    padding:9px 16px; border-bottom:1px solid var(--line-grid);
    display:flex; align-items:center; gap:7px; flex-shrink:0; flex-wrap:wrap;
    position:relative;
    background:linear-gradient(180deg, var(--panel-2), var(--bg));
  }
  header h1{font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin:0 10px 0 0; font-weight:600;}
  button{
    font-family:var(--mono); font-size:10.5px; color:var(--ink); background:var(--panel);
    border:1px solid var(--line-grid); border-radius:5px; padding:8px 11px; cursor:pointer;
    min-height:36px; touch-action:manipulation;
  }
  button:hover{border-color:var(--ink-dim);}
  button.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  button.danger:hover{border-color:var(--isolation); color:var(--isolation);}
  .sep{width:1px; height:20px; background:var(--line-grid); margin:0 2px;}
  main{flex:1; display:flex; min-height:0; position:relative;}
  #stage{flex:1; position:relative; overflow:hidden; background:
    radial-gradient(circle at 1px 1px, var(--line-grid) 1px, transparent 1px) 0 0/22px 22px, var(--bg);
    cursor:crosshair; touch-action:none;}
  svg{display:block;}
  aside{
    width:280px; flex-shrink:0; border-left:1px solid var(--line-grid);
    background:var(--panel-2); display:flex; flex-direction:column; min-height:0;
    transition:width 0.2s ease, min-width 0.2s ease; overflow-x:hidden; overflow-y:visible;
  }
  aside.collapsed{width:0; min-width:0; border-left:none;}
  #sidebarToggle{
    position:absolute; top:12px; right:280px; z-index:50;
    width:22px; height:44px; background:var(--panel); border:1px solid var(--line-grid);
    border-right:none; border-radius:6px 0 0 6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-dim); font-size:11px; transition:right 0.2s ease;
  }
  #sidebarToggle:hover{color:var(--accent); border-color:var(--accent);}
  #sidebarToggle.collapsed{right:0;}
  .panel-section{padding:12px 14px; border-bottom:1px solid var(--line-grid);}
  .panel-section h2{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); margin:0 0 8px 0; font-weight:600;}
  .legend-row{display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:11px; color:var(--ink-dim);}
  #btnFullKey:hover{color:var(--accent); border-color:var(--accent);}
  #libraryPanel{
    position:absolute; top:100%; z-index:60; margin-top:6px;
    background:var(--panel); border:1px solid var(--line-grid); border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5); max-height:70vh; overflow-y:auto;
    min-width:240px; padding:6px;
  }
  .library-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px; border-radius:5px; cursor:pointer; font-size:11.5px; color:var(--ink);
  }
  .library-item:hover{background:var(--accent-dim); color:var(--accent);}
  .library-item .lib-count{font-size:9.5px; color:var(--ink-faint); flex-shrink:0;}
  .library-item:hover .lib-count{color:var(--accent);}
  #fullKeyPanel{
    position:absolute; top:100%; left:8px; right:8px; z-index:60;
    background:var(--panel); border:1px solid var(--line-grid); border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5); max-height:60vh; overflow-y:auto;
    padding:10px;
  }
  .key-row{display:flex; align-items:center; gap:10px; padding:6px 4px; border-bottom:1px solid var(--line-grid);}
  .key-row:last-child{border-bottom:none;}
  .key-row .key-icon{flex-shrink:0; width:70px; height:40px;}
  .key-row .key-name{font-size:11px; color:var(--ink-dim);}
  .swatch{width:13px; height:4px; border-radius:2px; flex-shrink:0;}
  .iso-list{flex:1; overflow-y:auto;}
  .iso-item{padding:6px 9px; margin-bottom:5px; border-radius:4px; background:var(--isolation-dim); border:1px solid #7a2f3f; font-size:11px; line-height:1.4;}
  .iso-item b{color:var(--isolation);}
  .parallel-item{padding:6px 9px; margin-bottom:5px; border-radius:4px; background:var(--parallel-dim); border:1px solid #6d4a96; font-size:11px; line-height:1.4;}
  .parallel-item b{color:var(--parallel);}
  .empty-state{color:var(--ink-faint); font-size:11px; font-style:italic;}
  #log{flex:1; overflow-y:auto; padding:8px 14px; font-size:10.5px; color:var(--ink-dim); display:flex; flex-direction:column;}
  .log-entry{padding:4px 0; border-bottom:1px solid var(--line-grid); line-height:1.4;}
  .log-entry.blocked{color:var(--isolation);}
  .log-entry.ok{color:var(--energized);}
  .log-entry.warn{color:var(--parallel);}
  .log-entry .ts{color:var(--ink-faint); margin-right:5px;}
  .line-energized{stroke:var(--energized); stroke-width:2.5;}
  .line-deenergized{stroke:var(--deenergized); stroke-width:2.5;}
  .line-parallel{stroke:var(--parallel); stroke-width:3.5;}
  .el-label{fill:var(--ink-dim); font-family:var(--mono); text-anchor:middle;}
  .toggle{cursor:pointer;}
  .feeder-item{display:flex; align-items:center; gap:8px; padding:5px 8px; margin-bottom:4px; border-radius:4px; background:var(--panel); border:1px solid var(--line-grid); font-size:11px;}
  .feeder-swatch{width:12px; height:12px; border-radius:3px; flex-shrink:0;}
  .feeder-eye{cursor:pointer; font-size:13px; margin-left:auto; opacity:0.7; user-select:none;}
  .feeder-eye:hover{opacity:1;}
  .name-toggle:hover .name-text{fill:var(--accent) !important;}
</style>
</head>
<body>
<header>
  <h1>⏚ Network Builder</h1>
  <button id="btn_source">+ Source</button>
  <button id="btn_mainRecloser">+ Main Recloser</button>
  <button id="btn_feederRecloser">+ Feeder Recloser</button>
  <button id="btn_lcb">+ LCB</button>
  <button id="btn_bus">+ Bus</button>
  <div class="sep"></div>
  <button id="btn_knifeSwitch">+ Knife Switch</button>
  <button id="btn_jumper">+ Jumper</button>
  <button id="btn_fuse">+ Fuse</button>
  <button id="btn_tieSwitch">+ Tie Switch</button>
  <button id="btn_loadBuster">+ Load Buster</button>
  <button id="btn_tripsaver">+ Tripsaver</button>
  <button id="btn_load">+ Load</button>
  <button id="btn_textBox">+ Text</button>
  <div class="sep"></div>
  <button id="btn_line">⤴ Draw Line</button>
  <button id="btn_select">⬚ Select / Move</button>
  <button id="btn_pan">🖐 Pan</button>
  <button id="btn_rotate">↻ Rotate</button>
  <button id="btn_toggle">⇅ Toggle Open/Closed</button>
  <button id="btn_delete">✕ Delete</button>
  <div class="sep"></div>
  <button id="btn_clear" class="danger">Clear All</button>
  <div class="sep"></div>
  <button id="btn_zoomin">＋ Zoom</button>
  <button id="btn_zoomout">－ Zoom</button>
  <button id="btn_zoomreset">⊙ Reset</button>
  <div class="sep"></div>
  <button id="btn_deOutline" class="active">⬡ De-energized Outline</button>
  <div class="sep"></div>
  <button id="btn_save">💾 Save</button>
  <button id="btn_load_file">📂 Load</button>
  <button id="btn_library" style="position:relative;">📚 Diagrams ▾</button>
  <button id="btn_export_png">🖼 PNG</button>
  <button id="btn_export_pdf">📄 PDF</button>
  <input type="file" id="fileInput" accept=".json" style="display:none"/>
  <div id="libraryPanel" style="display:none;"></div>
</header>
<main>
  <div id="stage"></div>
  <div id="sidebarToggle" title="Show/hide panel">▶</div>
  <aside>
    <div class="panel-section" style="position:relative;">
      <h2 style="display:flex; justify-content:space-between; align-items:center;">
        Legend
        <span id="btnFullKey" style="cursor:pointer; font-size:9px; color:var(--ink-faint); text-transform:none; letter-spacing:0; font-weight:normal; padding:2px 6px; border:1px solid var(--line-grid); border-radius:3px;">🔑 Full Key ▾</span>
      </h2>
      <div class="legend-row"><span class="swatch" style="background:var(--energized)"></span> Energized</div>
      <div class="legend-row"><span class="swatch" style="background:var(--deenergized)"></span> De-energized</div>
      <div class="legend-row"><span class="swatch" style="background:var(--parallel)"></span> Paralleled (2+ sources)</div>
      <div class="legend-row"><span class="swatch" style="background:var(--isolation); height:13px;border-radius:50%;width:13px;"></span> Isolation point</div>
      <div id="fullKeyPanel" style="display:none;"></div>
    </div>
    <div class="panel-section" style="flex:0 0 auto; max-height:26%; display:flex; flex-direction:column;">
      <h2>Isolation points</h2>
      <div class="iso-list" id="isoList"></div>
    </div>
    <div class="panel-section" style="flex:0 0 auto; max-height:22%; display:flex; flex-direction:column;">
      <h2>Feeders</h2>
      <div class="iso-list" id="feederList"></div>
    </div>
    <div class="panel-section" style="flex:0 0 auto; max-height:20%; display:flex; flex-direction:column;">
      <h2>Parallel feed points</h2>
      <div class="iso-list" id="parList"></div>
    </div>
    <div class="panel-section" style="flex:1; display:flex; flex-direction:column; min-height:0; border-bottom:none;">
      <h2 style="display:flex; justify-content:space-between; align-items:center;">
        Event log
        <span style="display:flex;gap:4px;">
          <span id="btnStartLog" style="cursor:pointer; font-size:9px; color:var(--ink-faint); text-transform:none; letter-spacing:0; font-weight:normal; padding:2px 6px; border:1px solid var(--line-grid); border-radius:3px;">▶ Start</span>
          <span id="btnLogTxt" style="cursor:pointer; font-size:9px; color:var(--ink-faint); text-transform:none; letter-spacing:0; font-weight:normal; padding:2px 6px; border:1px solid var(--line-grid); border-radius:3px;">TXT</span>
          <span id="btnLogPdf" style="cursor:pointer; font-size:9px; color:var(--ink-faint); text-transform:none; letter-spacing:0; font-weight:normal; padding:2px 6px; border:1px solid var(--line-grid); border-radius:3px;">PDF</span>
          <span id="btnClearLog" style="cursor:pointer; font-size:9px; color:var(--ink-faint); text-transform:none; letter-spacing:0; font-weight:normal; padding:2px 6px; border:1px solid var(--line-grid); border-radius:3px;">Clear</span>
        </span>
      </h2>
      <div id="log"></div>
    </div>
  </aside>
</main>

const TYPES = {
  source:         { label:'Source',          kind:'source' },
  mainRecloser:   { label:'Main Recloser',    kind:'recloser', scale:2 },
  feederRecloser: { label:'Feeder Recloser',  kind:'recloser', scale:1*EL_SCALE },
  lcb:            { label:'LCB',              kind:'recloser', scale:1*EL_SCALE },
  knifeSwitch:    { label:'Knife Switch',     kind:'switch' },
  jumper:         { label:'Jumper',           kind:'switch' },
  fuse:           { label:'Fuse',             kind:'switch' },
  tieSwitch:      { label:'Tie Switch',       kind:'switch', tieSwitch:true },
  loadBuster:     { label:'Load Buster',      kind:'switch', loadBreak:true },
  tripsaver:      { label:'Tripsaver',         kind:'switch', loadBreak:true, tripsaver:true },
  bus:            { label:'Bus',              kind:'bus' },
  junction:       { label:'',                 kind:'junction' }, // T-tap on a line
  load:           { label:'Load',              kind:'load' },     // endpoint / consumer
  textBox:        { label:'',                  kind:'textBox' },  // free text annotation
};

/* ============================================================
   STATE
   ============================================================ */
let elements = [];
let lines = [];
let nextId = 1;
let activeTool = null;
let lineDraft = null;
let mousePos = null;
const CANVAS_W = 4800, CANVAS_H = 2800;
let vZoom = 1, vPanX = 0, vPanY = 0;
let loggingActive = false;
let labelDragState = null; // {elId, startMouseX, startMouseY, startOffX, startOffY}
let selectedIds = new Set();   // currently selected element IDs
let dragState = null;           // {startX,startY,elSnapshots,lineSnapshots} while dragging selection
let selectBox = null;           // {x1,y1,x2,y2} rubber-band in progress
let showDeenergizedOutline = true;

const stage = document.getElementById('stage');

function newElement(type, x, y){
  const def = TYPES[type];
  const el = { id:'el'+(nextId++), type, x, y, name:'', rotation:0, labelOffset:{x:0,y:0}, labelFontSize:10 };
  if(def.kind==='recloser') Object.assign(el, {busSwitch:'closed', breaker:'closed', lineSwitch:'closed', bypass:'open', groundTripBypassed:false});
  if(def.kind==='source') el.active = true;
  if(def.kind==='switch'){
    el.state = 'closed';
    if(def.tieSwitch) el.syncOk = false; // sync-check relay defaults to FAIL
  }
  return el;
}

/* ============================================================
   TOOLBAR
   ============================================================ */
const ACTION_KEYS = ['line','select','pan','rotate','toggle','delete'];
const PLACE_KEYS = Object.keys(TYPES);
const BUTTONS = {};
[...PLACE_KEYS, ...ACTION_KEYS].forEach(k=>{
  const btn = document.getElementById('btn_'+k);
  if(btn) BUTTONS[k] = btn;
});
function setTool(tool){
  activeTool = (activeTool === tool) ? null : tool;
  lineDraft = null;
  if(activeTool !== 'select'){ selectedIds.clear(); selectBox = null; dragState = null; }
  Object.entries(BUTTONS).forEach(([k,btn])=> btn.classList.toggle('active', k===activeTool));
  stage.style.cursor = activeTool === 'pan' ? 'grab' : '';

Object.keys(BUTTONS).forEach(k=> BUTTONS[k].addEventListener('click', ()=>setTool(k)));
document.getElementById('btn_deOutline').addEventListener('click', ()=>{
  showDeenergizedOutline = !showDeenergizedOutline;
  document.getElementById('btn_deOutline').classList.toggle('active', showDeenergizedOutline);
  render();
});

document.getElementById('btn_zoomin').addEventListener('click', ()=>{ vZoom = Math.min(10, vZoom*1.25); render(); });
document.getElementById('btn_zoomout').addEventListener('click', ()=>{ vZoom = Math.max(0.1, vZoom/1.25); render(); });
document.getElementById('btn_zoomreset').addEventListener('click', ()=>{ vZoom=1; vPanX=0; vPanY=0; render(); });

// Wheel to zoom centred on mouse position
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  // Mouse position in SVG coordinates before zoom
  const mx = vPanX + (e.clientX - rect.left) / rect.width  * (CANVAS_W/vZoom);
  const my = vPanY + (e.clientY - rect.top)  / rect.height * (CANVAS_H/vZoom);
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  const newZoom = Math.max(0.1, Math.min(10, vZoom * factor));
  vPanX = mx - (mx - vPanX) * (vZoom / newZoom);
  vPanY = my - (my - vPanY) * (vZoom / newZoom);
  vZoom = newZoom;
  updateViewBox();
}, {passive:false});

// Cheap pan/zoom: just repositions the existing SVG's viewBox instead of
// rebuilding the whole diagram. Used during drag/pinch so panning and
// zooming stay smooth regardless of how many elements are on the canvas.
function updateViewBox(){
  const svgEl = stage.querySelector('svg');
  if(!svgEl) return;
  const vw = CANVAS_W / vZoom, vh = CANVAS_H / vZoom;
  svgEl.setAttribute('viewBox', `${vPanX} ${vPanY} ${vw} ${vh}`);
}

// Pan via middle mouse, right-click drag, or spacebar + left drag
let panDrag = null;
let spaceDown = false;

document.addEventListener('keydown', e=>{
  const tag = document.activeElement && document.activeElement.tagName;
  const isTyping = tag==='INPUT' || tag==='TEXTAREA' || document.activeElement.isContentEditable;
  if(e.code==='Space' && !isTyping){ spaceDown=true; stage.style.cursor='grab'; e.preventDefault(); }
});
document.addEventListener('keyup',   e=>{ if(e.code==='Space'){ spaceDown=false; stage.style.cursor=''; } });

stage.addEventListener('mousedown', e=>{
  if(e.button===1 || e.button===2 || (e.button===0 && spaceDown) || (e.button===0 && activeTool==='pan')){
    e.preventDefault();
    panDrag = {startX:e.clientX, startY:e.clientY, startPanX:vPanX, startPanY:vPanY};
    stage.style.cursor = 'grabbing';
  }
});
stage.addEventListener('mousemove', e=>{
  if(!panDrag) return;
  const rect = stage.getBoundingClientRect();
  const dx = (e.clientX - panDrag.startX) / rect.width  * (CANVAS_W/vZoom);
  const dy = (e.clientY - panDrag.startY) / rect.height * (CANVAS_H/vZoom);
  vPanX = panDrag.startPanX - dx;
  vPanY = panDrag.startPanY - dy;
  updateViewBox();
});
stage.addEventListener('mouseup',   ()=>{ if(panDrag){ panDrag=null; stage.style.cursor = activeTool==='pan' ? 'grab' : (spaceDown?'grab':''); } });
stage.addEventListener('mouseleave',()=>{ if(panDrag){ panDrag=null; stage.style.cursor=''; } });
stage.addEventListener('contextmenu', e=> e.preventDefault()); // suppress right-click menu

/* ============================================================
   TOUCH SUPPORT (tablets / phones)
   - 1 finger: acts like a mouse click/drag (tap places elements,
     drags move selection, draws lines, etc. — same as desktop),
     UNLESS the Pan tool is active, in which case it pans.
   - 2 fingers: always pans (drag) and zooms (pinch), regardless
     of which tool is active — matches standard map/drawing app
     conventions on touch devices.
   Implementation note: click/select-drag handling is wired onto
   the live <svg> element fresh on every render() call, so rather
   than calling named handler functions, we dispatch real synthetic
   MouseEvents at the element under the touch point — this reaches
   whatever listeners are currently attached, exactly like a real
   mouse would.
   ============================================================ */
let touchState = null;

function touchMidpoint(t0, t1){
  return { x:(t0.clientX+t1.clientX)/2, y:(t0.clientY+t1.clientY)/2 };
}
function touchDist(t0, t1){
  return Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY);
}
function dispatchSynthMouse(type, touch){
  const target = document.elementFromPoint(touch.clientX, touch.clientY) || stage;
  const ev = new MouseEvent(type, {
    bubbles:true, cancelable:true, view:window,
    clientX:touch.clientX, clientY:touch.clientY, button:0,
  });
  target.dispatchEvent(ev);
}

stage.addEventListener('touchstart', e=>{
  if(e.touches.length === 2){
    e.preventDefault();
    // Cancel any in-progress single-finger action (line draw, drag, etc.)
    dragState = null; labelDragState = null; selectBox = null;
    touchState = {
      mode:'pinch',
      startDist: touchDist(e.touches[0], e.touches[1]),
      startZoom: vZoom,
      startMid: touchMidpoint(e.touches[0], e.touches[1]),
      startPanX: vPanX, startPanY: vPanY,
    };
    return;
  }
  if(e.touches.length === 1){
    const t = e.touches[0];
    if(activeTool === 'pan'){
      e.preventDefault();
      touchState = {mode:'pan1', startX:t.clientX, startY:t.clientY, startPanX:vPanX, startPanY:vPanY};
      return;
    }
    // Otherwise mirror a real mouse click/drag via synthetic events.
    // preventDefault here is essential: without it, the browser ALSO
    // fires its own native click after touchend, which would run
    // onStageClick's toggle logic a second time (silently un-toggling
    // whatever we just toggled — looks like "nothing happened").
    e.preventDefault();
    touchState = {mode:'touch1', startX:t.clientX, startY:t.clientY, moved:false};
    dispatchSynthMouse('mousedown', t);
  }
}, {passive:false});

stage.addEventListener('touchmove', e=>{
  if(!touchState) return;
  e.preventDefault();
  if(touchState.mode === 'pinch' && e.touches.length === 2){
    const dist = touchDist(e.touches[0], e.touches[1]);
    const mid = touchMidpoint(e.touches[0], e.touches[1]);
    const newZoom = Math.max(0.1, Math.min(10, touchState.startZoom * (dist/touchState.startDist)));
    const rect = stage.getBoundingClientRect();
    const anchorX = touchState.startPanX + (touchState.startMid.x-rect.left)/rect.width  * (CANVAS_W/touchState.startZoom);
    const anchorY = touchState.startPanY + (touchState.startMid.y-rect.top)/rect.height * (CANVAS_H/touchState.startZoom);
    vZoom = newZoom;
    vPanX = anchorX - (mid.x-rect.left)/rect.width  * (CANVAS_W/newZoom);
    vPanY = anchorY - (mid.y-rect.top)/rect.height * (CANVAS_H/newZoom);
    updateViewBox();
    return;
  }
  if(touchState.mode === 'pan1'){
    const t = e.touches[0];
    const rect = stage.getBoundingClientRect();
    const dx = (t.clientX - touchState.startX) / rect.width  * (CANVAS_W/vZoom);
    const dy = (t.clientY - touchState.startY) / rect.height * (CANVAS_H/vZoom);
    vPanX = touchState.startPanX - dx;
    vPanY = touchState.startPanY - dy;
    updateViewBox();
    return;
  }
  if(touchState.mode === 'touch1'){
    const t = e.touches[0];
    if(Math.hypot(t.clientX-touchState.startX, t.clientY-touchState.startY) > 10) touchState.moved = true;
    dispatchSynthMouse('mousemove', t);
  }
}, {passive:false});

stage.addEventListener('touchend', e=>{
  if(!touchState) return;
  if(touchState.mode === 'touch1'){
    e.preventDefault(); // stop the browser's own native click synthesis too
    const t = e.changedTouches[0];
    dispatchSynthMouse('mouseup', t);
    if(!touchState.moved) dispatchSynthMouse('click', t);
  }
  if(e.touches.length === 0) touchState = null;
}, {passive:false});

document.getElementById('btn_clear').addEventListener('click', ()=>{
  if(!confirm('Clear the entire diagram?')) return;
  elements = []; lines = []; lineDraft = null;
  logEvent('Diagram cleared', 'ok');

});
document.addEventListener('keydown', e=>{

/* ============================================================
   GEOMETRY / PORTS
   A 2-terminal device (recloser, switch) exposes a left and right
   port. A bus collapses every connection along its length onto a
   single electrical node. A source is a single always-energized
   root node.
   ============================================================ */
function busTopBottom(el){ return { top: el.y - BUS_LENGTH/2, bottom: el.y + BUS_LENGTH/2 }; }

// Rotate point (px,py) around centre (cx,cy) by deg degrees
function rotatePoint(px, py, cx, cy, deg){
  if(!deg) return {x:px, y:py};
  const rad = deg * Math.PI / 180;
  const cos = Math.round(Math.cos(rad)*1e9)/1e9; // avoid floating point noise on 90° steps
  const sin = Math.round(Math.sin(rad)*1e9)/1e9;
  const dx = px-cx, dy = py-cy;
  return { x: cx + dx*cos - dy*sin, y: cy + dx*sin + dy*cos };
}

function portsOf(el){
  const def = TYPES[el.type];
  const rot = el.rotation || 0;
  if(def.kind==='junction') return { dual:false, id:el.id, x:el.x, y:el.y };
  if(def.kind==='load'){
    const p = rotatePoint(el.x, el.y, el.x, el.y, rot);
    return { dual:false, id:el.id, x:p.x, y:p.y };
  }
  if(def.kind==='recloser'){
    const q = (BASE_RECLOSER_W*def.scale)/2;
    const L = rotatePoint(el.x-q, el.y, el.x, el.y, rot);
    const R = rotatePoint(el.x+q, el.y, el.x, el.y, rot);
    return { dual:true, Lid:el.id+'_L', Lx:L.x, Ly:L.y, Rid:el.id+'_R', Rx:R.x, Ry:R.y };
  }
  if(def.kind==='switch'){
    const arm = 15*EL_SCALE;
    const L = rotatePoint(el.x-arm, el.y, el.x, el.y, rot);
    const R = rotatePoint(el.x+arm, el.y, el.x, el.y, rot);
    return { dual:true, Lid:el.id+'_L', Lx:L.x, Ly:L.y, Rid:el.id+'_R', Rx:R.x, Ry:R.y };
  }
  if(def.kind==='bus'){
    // Bus is vertical at 0° and 180°, horizontal at 90° and 270°
    return { dual:false, id:el.id, x:el.x, y:el.y };
  }
  return { dual:false, id:el.id, x:el.x, y:el.y };
}

function findSnapTarget(x, y, excludeElId){
  let best=null, bestD=SNAP_RADIUS;
  for(const el of elements){
    if(el.id===excludeElId) continue;
    const def = TYPES[el.type];
    if(def.kind==='bus'){
      const {top,bottom} = busTopBottom(el);
      const cy = Math.max(top, Math.min(bottom, y));
      const d = Math.hypot(x-el.x, y-cy);
      if(d<bestD){ best={nodeId:el.id, point:{x:el.x,y:cy}}; bestD=d; }
    } else {
      const p = portsOf(el);
      if(p.dual){
        const dL = Math.hypot(x-p.Lx, y-p.Ly);
        if(dL<bestD){ best={nodeId:p.Lid, point:{x:p.Lx,y:p.Ly}}; bestD=dL; }
        const dR = Math.hypot(x-p.Rx, y-p.Ry);
        if(dR<bestD){ best={nodeId:p.Rid, point:{x:p.Rx,y:p.Ry}}; bestD=dR; }
      } else {
        const d = Math.hypot(x-p.x, y-p.y);
        if(d<bestD){ best={nodeId:p.id, point:{x:p.x,y:p.y}}; bestD=d; }
      }
    }
  }
  return best;
}

// Snap to the nearest point ON an existing line segment (for T-junction creation)
function findLineSnap(x, y){
  let best = null, bestD = SNAP_RADIUS;
  for(const ln of lines){
    const pts = ln.points;
    for(let i=0; i<pts.length-1; i++){
      const a = pts[i], b = pts[i+1];
      const dx = b.x-a.x, dy = b.y-a.y;
      const len2 = dx*dx+dy*dy;
      if(len2===0) continue;
      let t = ((x-a.x)*dx+(y-a.y)*dy)/len2;
      t = Math.max(0.05, Math.min(0.95, t)); // avoid snapping right at endpoints
      const cx = a.x+t*dx, cy = a.y+t*dy;
      const d = Math.hypot(x-cx, y-cy);
      if(d < bestD){ best = {lineId:ln.id, segIdx:i, t, point:{x:cx, y:cy}}; bestD=d; }
    }
  }
  return best;
}

// Split a line at a junction point — the original line becomes two lines
// sharing the junction node as an endpoint, creating a real T electrically.
function splitLineAtPoint(lineId, segIdx, snapPoint){
  const ln = lines.find(l=>l.id===lineId);
  if(!ln) return null;
  const jId = 'jn'+(nextId++);
  const jp = {x: snapPoint.x, y: snapPoint.y};
  // Build the two halves
  const firstHalf  = [...ln.points.slice(0, segIdx+1), jp];
  const secondHalf = [jp, ...ln.points.slice(segIdx+1)];
  // Replace original line with two lines
  lines = lines.filter(l=>l.id!==lineId);
  lines.push({ id:'ln'+(nextId++), points:firstHalf,  fromNodeId:ln.fromNodeId, toNodeId:jId });
  lines.push({ id:'ln'+(nextId++), points:secondHalf, fromNodeId:jId, toNodeId:ln.toNodeId });
  // Create the junction element (small dot, no label, always-conducting node)
  elements.push({ id:jId, type:'junction', x:jp.x, y:jp.y, name:'' });
  logEvent('T-junction created on line — branch from here', 'ok');
  return jId;
}

function orthogonalConstrain(lastPt, rawPt){
  const dx = Math.abs(rawPt.x-lastPt.x), dy = Math.abs(rawPt.y-lastPt.y);
  return dx>dy ? {x:rawPt.x, y:lastPt.y} : {x:lastPt.x, y:rawPt.y};
}

function svgPoint(evt){
  const svgEl = stage.querySelector('svg');
  const pt = svgEl.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svgEl.getScreenCTM().inverse());
  return {x:p.x, y:p.y};
}

/* ============================================================
   ELECTRICAL ENGINE
   ============================================================ */
function elementConducts(el){
  const def = TYPES[el.type];
  if(def.kind==='recloser'){
    return (el.busSwitch==='closed' && el.breaker==='closed' && el.lineSwitch==='closed') || el.bypass==='closed';
  }
  if(def.kind==='switch') return el.state==='closed';
  return true;
}

function buildGraph(){
  const edges = [];
  for(const ln of lines) edges.push({from:ln.fromNodeId, to:ln.toNodeId, conducts:true, kind:'line', ref:ln});
  for(const el of elements){
    const p = portsOf(el);
    if(p.dual) edges.push({from:p.Lid, to:p.Rid, conducts:elementConducts(el), kind:'device', ref:el});
  }
  const sources = elements.filter(e=>TYPES[e.type].kind==='source' && e.active!==false).map(e=>e.id);
  return {edges, sources};
}

// Extended colour pool for feeder assignment
const LABEL_FONT_SIZES = [10, 14, 18, 24];
const FEEDER_COLOR_POOL = ['#c084fc','#00d4cc','#6fa8ff','#ff9500','#ff6b9d'];

// Persistent feeder colour assignments — only re-randomise when topology changes
let feederColorMap = {}; // elementId → colour string
let feederVisibility = {}; // elementId → boolean (true=visible, default)
let feederNodeSetsGlobal = {}; // elementId → Set — updated each render

function assignFeederColors(feeders, feederNodeSets){
  // Remove stale assignments for deleted feeders
  const currentIds = new Set(feeders.map(f=>f.id));
  Object.keys(feederColorMap).forEach(id=>{ if(!currentIds.has(id)) delete feederColorMap[id]; });

  // Clear any assignment using a colour that's no longer in the pool
  // (e.g. after the palette itself is changed) so it gets reassigned below
  Object.keys(feederColorMap).forEach(id=>{
    if(!FEEDER_COLOR_POOL.includes(feederColorMap[id])) delete feederColorMap[id];
  });

  // With 5 or fewer feeders, the pool has enough colours to give every
  // feeder a fully unique colour — not just avoid clashes between
  // feeders that happen to be adjacent. Enforce that guarantee here.
  if(feeders.length <= FEEDER_COLOR_POOL.length){
    // If any colour is currently shared by more than one feeder, keep the
    // first holder and clear the rest so they get reassigned below.
    const seen = new Set();
    feeders.forEach(f=>{
      const c = feederColorMap[f.id];
      if(c){
        if(seen.has(c)) delete feederColorMap[f.id];
        else seen.add(c);
      }
    });

    feeders.forEach(f=>{
      if(feederColorMap[f.id]) return; // already has a unique colour
      const usedColors = new Set(feeders.map(o=>feederColorMap[o.id]).filter(Boolean));
      const available = FEEDER_COLOR_POOL.filter(c=>!usedColors.has(c));
      const pool = available.length > 0 ? available : FEEDER_COLOR_POOL;
      feederColorMap[f.id] = pool[Math.floor(Math.random()*pool.length)];
    });
    return;
  }

  // More feeders than colours available: fall back to adjacency-only
  // avoidance (only guarantee that visually-connected/adjacent feeders
  // don't share a colour — full global uniqueness isn't possible).
  feeders.forEach((fi, i)=>{
    if(feederColorMap[fi.id]) return; // already has a colour

    // Find which other feeders are adjacent to fi
    const usedColors = new Set();
    const liI = fi.id + '_L';
    // Nodes the L port of fi connects to via lines
    const busNodesI = new Set(lines
      .filter(ln=>ln.fromNodeId===liI||ln.toNodeId===liI)
      .map(ln=>ln.fromNodeId===liI?ln.toNodeId:ln.fromNodeId));

    feeders.forEach((fj, j)=>{
      if(i===j || !feederColorMap[fj.id]) return;
      // Adjacent if they share bus nodes
      const liJ = fj.id + '_L';
      const busNodesJ = new Set(lines
        .filter(ln=>ln.fromNodeId===liJ||ln.toNodeId===liJ)
        .map(ln=>ln.fromNodeId===liJ?ln.toNodeId:ln.fromNodeId));
      let adjacent = [...busNodesI].some(n=>busNodesJ.has(n));
      // Or if downstream regions share a node (tie-switch case)
      if(!adjacent && feederNodeSets[i] && feederNodeSets[j]){
        adjacent = [...feederNodeSets[i]].some(n=>feederNodeSets[j].has(n));
      }
      if(adjacent) usedColors.add(feederColorMap[fj.id]);
    });

    // Pick a random available colour
    const available = FEEDER_COLOR_POOL.filter(c=>!usedColors.has(c));
    const pool = available.length > 0 ? available : FEEDER_COLOR_POOL;
    feederColorMap[fi.id] = pool[Math.floor(Math.random()*pool.length)];
  });
}

function computeFeederColoring(visited){
  const feeders = elements.filter(e=>e.type==='feederRecloser');
  const nodeColor = {};
  if(!feeders.length) return nodeColor;

  // BFS downstream region for each feeder
  const feederNodeSets = feeders.map(feeder=>{
    const startNode = feeder.id + '_R';
    if(!visited.has(startNode)) return new Set();
    const seen = new Set([startNode]);
    const queue = [startNode];
    while(queue.length){
      const cur = queue.shift();
      for(const ln of lines){
        let other = ln.fromNodeId===cur ? ln.toNodeId : ln.toNodeId===cur ? ln.fromNodeId : null;
        if(!other||seen.has(other)||!visited.has(other)) continue;
        seen.add(other); queue.push(other);
      }
      for(const el of elements){
        const def = TYPES[el.type];
        // Only block at feeder/main recloser boundaries — LCBs are part of the same feeder
        if(el.type==='feederRecloser' || el.type==='mainRecloser') continue;
        if(!elementConducts(el)) continue;
        const p = portsOf(el);
        if(!p.dual) continue;
        if(p.Lid===cur&&visited.has(p.Rid)&&!seen.has(p.Rid)){seen.add(p.Rid);queue.push(p.Rid);}
        if(p.Rid===cur&&visited.has(p.Lid)&&!seen.has(p.Lid)){seen.add(p.Lid);queue.push(p.Lid);}
      }
    }
    return seen;
  });

  assignFeederColors(feeders, feederNodeSets);

  // Store node sets globally so render can check visibility
  feederNodeSetsGlobal = {};
  feeders.forEach((feeder, i)=>{
    feederNodeSetsGlobal[feeder.id] = feederNodeSets[i];
    const color = feederColorMap[feeder.id];
    if(color) feederNodeSets[i].forEach(n=>{ nodeColor[n]=color; });
  });

  return nodeColor;
}

function isFeederNodeHidden(nodeId){
  for(const [fid, nodeSet] of Object.entries(feederNodeSetsGlobal)){
    if(feederVisibility[fid]===false && nodeSet && nodeSet.has(nodeId)) return true;
  }
  return false;
}

function isNodeInVisibleFeeder(nodeId){
  for(const [fid, nodeSet] of Object.entries(feederNodeSetsGlobal)){
    if(feederVisibility[fid]!==false && nodeSet && nodeSet.has(nodeId)) return true;
  }
  return false;
}

function isElementHidden(el){
  // Feeder recloser itself — hide when explicitly toggled
  if(el.type==='feederRecloser' && feederVisibility[el.id]===false) return true;
  const p = portsOf(el);
  if(p.dual){
    const Lhid = isFeederNodeHidden(p.Lid);
    const Rhid = isFeederNodeHidden(p.Rid);
    if(!Lhid && !Rhid) return false; // neither side in any hidden feeder → keep visible
    // At least one side is in a hidden feeder.
    // Keep visible ONLY if the other side is in a visible feeder (boundary element between feeders).
    if(Lhid && isNodeInVisibleFeeder(p.Rid)) return false;
    if(Rhid && isNodeInVisibleFeeder(p.Lid)) return false;
    // Otherwise: both hidden, or one hidden + other on source/main bus → hide
    return true;
  }
  return isFeederNodeHidden(p.id);
}

function isLineHidden(ln){
  const fromHid = isFeederNodeHidden(ln.fromNodeId);
  const toHid   = isFeederNodeHidden(ln.toNodeId);
  if(!fromHid && !toHid) return false;
  if(fromHid && isNodeInVisibleFeeder(ln.toNodeId)) return false;
  if(toHid   && isNodeInVisibleFeeder(ln.fromNodeId)) return false;
  return true;
}

function computeEnergization(){
  const {edges, sources} = buildGraph();
  const reachBy = {};
  const ensure = n => { if(!reachBy[n]) reachBy[n] = new Set(); };
  for(const src of sources){
    ensure(src);
    const seen = new Set([src]), queue=[src];
    while(queue.length){
      const cur = queue.shift();
      for(const e of edges){
        let other = null;
        if(e.from===cur) other=e.to; else if(e.to===cur) other=e.from; else continue;
        if(e.conducts && !seen.has(other)){ seen.add(other); queue.push(other); }
      }
    }
    seen.forEach(n=>{ ensure(n); reachBy[n].add(src); });
  }
  const visited = new Set(Object.keys(reachBy).filter(n=>reachBy[n].size>0));
  return {visited, reachBy, edges, sources};
}

function findIsolationPoints(visited, edges){
  const pts = [];
  for(const e of edges){
    if(e.kind!=='device') continue;
    if(!e.conducts && (visited.has(e.from) || visited.has(e.to))){
      pts.push(e.ref);
    }
  }
  return pts;
}

function findParallelNodes(reachBy){
  return Object.keys(reachBy).filter(n=>reachBy[n].size>1);
}

/* ============================================================
   INTERLOCKS
   ============================================================ */
function logEvent(msg, cls){
  if(!loggingActive) return;
  const log = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + (cls||'');
  const ts = new Date().toLocaleTimeString([], {hour12:false});
  entry.innerHTML = `<span class="ts">${ts}</span>${msg}`;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function elName(el){ return el.name || TYPES[el.type].label; }

function attemptToggleRecloser(elId, sub){
  const el = elements.find(e=>e.id===elId);
  if(!el) return;
  if(sub==='bypass' || sub==='breaker'){
    el[sub] = el[sub]==='closed' ? 'open' : 'closed';
    logEvent(`${elName(el)}: ${sub} → ${el[sub].toUpperCase()}`, 'ok');
    return;
  }
  if(el.breaker !== 'open'){
    logEvent(`BLOCKED: ${elName(el)} ${sub} cannot switch — breaker must be OPEN first`, 'blocked');
    return;
  }
  el[sub] = el[sub]==='closed' ? 'open' : 'closed';
  logEvent(`${elName(el)}: ${sub} → ${el[sub].toUpperCase()}`, 'ok');
}

function attemptToggleSwitch(elId){
  const el = elements.find(e=>e.id===elId);
  if(!el) return;
  const def = TYPES[el.type];
  const p = portsOf(el);
  const {visited} = computeEnergization();

  if(el.state==='closed'){
    // Load busters can open on load — no energization interlock
    if(def.loadBreak){
      el.state = 'open';
      logEvent(`${elName(el)}: → OPEN (load-break rated — opened on load)`, 'ok');
      return;
    }
    // All other switches require de-energized line to open
    if(visited.has(p.Lid) || visited.has(p.Rid)){
      logEvent(`BLOCKED: ${elName(el)} cannot open — still ENERGIZED. Use a load-break device to open on load.`, 'blocked');
      return;
    }
    el.state = 'open';
    logEvent(`${elName(el)}: → OPEN`, 'ok');
  } else {
    // Closing a tie switch requires sync-check OK
    if(def.tieSwitch){
      if(!el.syncOk){
        logEvent(`BLOCKED: ${elName(el)} cannot close — SYNC CHECK FAIL. Click the SYNC relay on the tie switch to simulate sync-ok before closing.`, 'blocked');
        return;
      }
      el.state = 'closed';
      const after = computeEnergization();
      const parallel = [p.Lid, p.Rid].some(n => after.reachBy[n] && after.reachBy[n].size > 1);
      if(parallel){
        logEvent(`${elName(el)}: → CLOSED (SYNC OK) — feeders are now PARALLELED`, 'warn');
      } else {
        logEvent(`${elName(el)}: → CLOSED (SYNC OK)`, 'ok');
      }
      return;
    }
    el.state = 'closed';
    logEvent(`${elName(el)}: → CLOSED`, 'ok');
  }
}

/* ============================================================
   SYMBOLS
   ============================================================ */
function recloserExact(el, isoSet){
  const def = TYPES[el.type];
  const q = (BASE_RECLOSER_W*def.scale)/2;
  const xBus = el.x-q, xOut = el.x+q, yCenter = el.y;
  const s = (xOut-xBus)/385;
  const tx = lx => xBus + s*lx;
  const ty = ly => yCenter + s*(ly-47.5);
  const k = s/0.6753;
  const swThin = Math.max(0.75,1*k).toFixed(2);
  const swMed = Math.max(1,2*k).toFixed(2);
  const swThick = Math.max(1.2,2.5*k).toFixed(2);

  const cIso = el.busSwitch==='closed' ? 'var(--energized)' : 'var(--deenergized)';
  const cBrk = el.breaker==='closed' ? 'var(--energized)' : 'var(--deenergized)';
  const cLs = el.lineSwitch==='closed' ? 'var(--energized)' : 'var(--deenergized)';
  const cByp = el.bypass==='closed' ? 'var(--energized)' : 'var(--deenergized)';
  const isIso = isoSet.has(el);
  const tt = activeTool==='toggle';

  let g = '';
  // Feeder recloser — add a click-to-colour-pick overlay on the box body
  if(el.type === 'feederRecloser'){
    const fc = feederColorMap[el.id];
    const indicator = fc ? `<rect x="${tx(155)}" y="${ty(12)}" width="${s*75}" height="${s*30}" rx="2" fill="${fc}" opacity="0.35"/>` : '';
    g += `<g data-feeder-color-el="${el.id}" style="cursor:${tt?'pointer':'default'}">
      <rect x="${tx(0)}" y="${ty(0)}" width="${s*385}" height="${s*95}" fill="transparent"/>
      ${indicator}
    </g>`;
  }
  g += `<line x1="${tx(0)}" y1="${ty(0)}" x2="${tx(145)}" y2="${ty(0)}" stroke="var(--ink-faint)" stroke-width="${swThin}"/>`;
  g += `<line x1="${tx(243)}" y1="${ty(0)}" x2="${tx(385)}" y2="${ty(0)}" stroke="var(--ink-faint)" stroke-width="${swThin}"/>`;
  g += `<line x1="${tx(0)}" y1="${ty(95)}" x2="${tx(385)}" y2="${ty(95)}" stroke="var(--ink-faint)" stroke-width="${swThin}"/>`;
  g += `<line x1="${tx(0)}" y1="${ty(0)}" x2="${tx(0)}" y2="${ty(95)}" stroke="var(--ink-faint)" stroke-width="${swThin}"/>`;
  g += `<line x1="${tx(385)}" y1="${ty(0)}" x2="${tx(385)}" y2="${ty(95)}" stroke="var(--ink-faint)" stroke-width="${swThin}"/>`;

  g += `<g class="toggle" data-toggle-el="${el.id}" data-toggle-sub="bypass" style="cursor:${tt?'pointer':'default'}">
    <rect x="${tx(140)}" y="${ty(-60)}" width="${s*110}" height="${s*70}" fill="transparent"/>
    <line x1="${tx(145)}" y1="${ty(0)}" x2="${tx(245)}" y2="${ty(el.bypass==='closed'?0:-51)}" stroke="${cByp}" stroke-width="${swMed}"/>
  </g>`;
  g += `<g class="toggle" data-toggle-el="${el.id}" data-toggle-sub="breaker" style="cursor:${tt?'pointer':'default'}">
    <rect x="${tx(140)}" y="${ty(40)}" width="${s*110}" height="${s*110}" fill="transparent"/>
    <line x1="${tx(145)}" y1="${ty(49)}" x2="${tx(245)}" y2="${ty(144)}" stroke="${cBrk}" stroke-width="${swThick}"/>
    <line x1="${tx(245)}" y1="${ty(49)}" x2="${tx(145)}" y2="${ty(144)}" stroke="${cBrk}" stroke-width="${swThick}"/>
  </g>`;
  g += `<g class="toggle" data-toggle-el="${el.id}" data-toggle-sub="busSwitch" style="cursor:${tt?'pointer':'default'}">
    <rect x="${tx(30)}" y="${ty(30)}" width="${s*90}" height="${s*135}" fill="transparent"/>
    <line x1="${tx(46)}" y1="${ty(147)}" x2="${tx(102)}" y2="${ty(46)}" stroke="${cIso}" stroke-width="${swThick}"/>
  </g>`;
  g += `<g class="toggle" data-toggle-el="${el.id}" data-toggle-sub="lineSwitch" style="cursor:${tt?'pointer':'default'}">
    <rect x="${tx(280)}" y="${ty(30)}" width="${s*90}" height="${s*135}" fill="transparent"/>
    <line x1="${tx(293)}" y1="${ty(147)}" x2="${tx(338)}" y2="${ty(46)}" stroke="${cLs}" stroke-width="${swThick}"/>
  </g>`;
  if(isIso) g += `<circle cx="${el.x}" cy="${el.y}" r="${q+14}" fill="none" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="3,2"/>`;

  // Ground Trip badge — same compact style as sync-check relay on tie switches
  // Sits above the bypass blade attachment point
  const gtBypassed = el.groundTripBypassed;
  const gtColor = gtBypassed ? '#ff5d5d' : '#3ddc84';
  const gtBg    = gtBypassed ? '#5a2030' : '#1f5d3c';
  const gtLabel = gtBypassed ? 'G.T BYP' : 'G.T';
  const gtScale = def.scale / 2; // scale=2 (main) → 1.0 (original); scale=1 (feeder/LCB) → 0.5
  const gtW = 29 * gtScale, gtH = 13 * gtScale;
  const gtX = tx(145) - gtW/2;
  const gtY = ty(-100);
  g += `<g data-gt-el="${el.id}" style="cursor:${tt?'pointer':'default'}">
    <rect x="${gtX}" y="${gtY}" width="${gtW}" height="${gtH}" rx="${2*gtScale}" fill="${gtBg}" stroke="${gtColor}" stroke-width="${gtScale}"/>
    <text x="${gtX + gtW/2}" y="${gtY + gtH - 3*gtScale}" text-anchor="middle" font-size="${7*gtScale}" fill="${gtColor}" font-family="var(--mono)" font-weight="bold">${gtLabel}</text>
  </g>`;

  return g;
}

// Small X terminal marker — replaces filled circle contact dots
function xMark(cx, cy, color, r=2.5){
  return `<line x1="${cx-r}" y1="${cy-r}" x2="${cx+r}" y2="${cy+r}" stroke="${color}" stroke-width="1.3"/>
          <line x1="${cx+r}" y1="${cy-r}" x2="${cx-r}" y2="${cy+r}" stroke="${color}" stroke-width="1.3"/>`;
}

function tripsaverGlyph(el, isoSet){
  const def = TYPES[el.type];
  const isOpen = el.state === 'open';
  const color = el.state === 'closed' ? '#3ddc84' : '#7a8fa8';
  const r = 7*EL_SCALE;
  const tt = activeTool === 'toggle';

  // Four corner contact dots
  const corners = [
    {x: el.x-r, y: el.y-r},
    {x: el.x+r, y: el.y+r},
    {x: el.x+r, y: el.y-r},
    {x: el.x-r, y: el.y+r},
  ];

  let g = `<g data-toggle-el="${el.id}" data-toggle-sub="state" style="cursor:${tt?'pointer':'default'}">`;
  g += `<rect x="${el.x-r-4}" y="${el.y-r-4}" width="${(r+4)*2}" height="${(r+4)*2}" fill="transparent"/>`;

  // Two crossing diagonals — when open, only draw one (dashed) to show break
  if(isOpen){
    g += `<line x1="${el.x-r}" y1="${el.y-r}" x2="${el.x+r}" y2="${el.y+r}" stroke="${color}" stroke-width="${2*EL_SCALE}" stroke-dasharray="3,3"/>`;
    g += `<line x1="${el.x+r}" y1="${el.y-r}" x2="${el.x-r}" y2="${el.y+r}" stroke="${color}" stroke-width="${2*EL_SCALE}" stroke-dasharray="3,3"/>`;
  } else {
    g += `<line x1="${el.x-r}" y1="${el.y-r}" x2="${el.x+r}" y2="${el.y+r}" stroke="${color}" stroke-width="${2*EL_SCALE}"/>`;
    g += `<line x1="${el.x+r}" y1="${el.y-r}" x2="${el.x-r}" y2="${el.y+r}" stroke="${color}" stroke-width="${2*EL_SCALE}"/>`;
  }

  // Contact dots at the four corners
  corners.forEach(c => { g += `<circle cx="${c.x}" cy="${c.y}" r="${2.5*EL_SCALE}" fill="${color}"/>`; });

  g += `</g>`;
  if(isoSet.has(el)) g += `<circle cx="${el.x}" cy="${el.y}" r="22" fill="none" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="3,2"/>`;
  return g;
}

function fuseGlyph(el, isoSet){
  const color = el.state==='closed' ? '#3ddc84' : '#7a8fa8';
  const tt = activeTool==='toggle';
  const x = el.x, y = el.y;
  const arm = 5*EL_SCALE, ow = 10*EL_SCALE, oh = 5*EL_SCALE, iw = 6*EL_SCALE, ih = 3*EL_SCALE;

  let g = `<g data-toggle-el="${el.id}" data-toggle-sub="state" style="cursor:${tt?'pointer':'default'}">`;
  g += `<rect x="${x-ow-arm-4}" y="${y-oh-4}" width="${(ow+arm+4)*2}" height="${(oh+4)*2}" fill="transparent"/>`;

  // Contact dots
  g += xMark(x-ow-arm, y, color, 2.5*EL_SCALE);
  g += xMark(x+ow+arm, y, color, 2.5*EL_SCALE);

  if(el.state==='closed'){
    // Left stub
    g += `<line x1="${x-ow-arm}" y1="${y}" x2="${x-ow}" y2="${y}" stroke="${color}" stroke-width="${2*EL_SCALE}"/>`;
    // Right stub
    g += `<line x1="${x+ow}" y1="${y}" x2="${x+ow+arm}" y2="${y}" stroke="${color}" stroke-width="${2*EL_SCALE}"/>`;
  } else {
    // Open — stubs with gap
    g += `<line x1="${x-ow-arm}" y1="${y}" x2="${x-ow-4}" y2="${y}" stroke="${color}" stroke-width="${2*EL_SCALE}"/>`;
    g += `<line x1="${x+ow+4}" y1="${y}" x2="${x+ow+arm}" y2="${y}" stroke="${color}" stroke-width="${2*EL_SCALE}"/>`;
  }

  // Outer rectangle
  g += `<rect x="${x-ow}" y="${y-oh}" width="${ow*2}" height="${oh*2}" fill="none" stroke="${color}" stroke-width="1.8"/>`;
  // Inner rectangle
  g += `<rect x="${x-iw}" y="${y-ih}" width="${iw*2}" height="${ih*2}" fill="none" stroke="${color}" stroke-width="1.2"/>`;

  g += `</g>`;
  if(isoSet.has(el)) g += `<circle cx="${x}" cy="${y}" r="${ow+8}" fill="none" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="3,2"/>`;
  return g;
}

function switchBladeGlyph(el, isoSet){
  const def = TYPES[el.type];
  const isOpen = el.state==='open';
  const color = el.state==='closed' ? '#3ddc84' : '#7a8fa8';
  const arm = 15*EL_SCALE;
  const hx = el.x-arm, hy = el.y;
  const end = isOpen ? {x:el.x+6*EL_SCALE, y:el.y-16*EL_SCALE} : {x:el.x+arm, y:el.y};
  const tt = activeTool==='toggle';
  let g = `<g class="toggle" data-toggle-el="${el.id}" data-toggle-sub="state" style="cursor:${tt?'pointer':'default'}">`;
  g += `<rect x="${el.x-20*EL_SCALE}" y="${el.y-30*EL_SCALE}" width="${40*EL_SCALE}" height="${40*EL_SCALE}" fill="transparent"/>`;
  g += xMark(hx, hy, color, 2.5*EL_SCALE);
  g += xMark(el.x+arm, el.y, color, 2.5*EL_SCALE);
  g += `<line x1="${hx}" y1="${hy}" x2="${end.x}" y2="${end.y}" stroke="${color}" stroke-width="${2*EL_SCALE}"/>`;
  // Load buster badge — small "LB" tag on the blade to distinguish from a plain knife switch
  if(def.loadBreak){
    g += `<rect x="${el.x-8*EL_SCALE}" y="${el.y-30*EL_SCALE}" width="${16*EL_SCALE}" height="${10*EL_SCALE}" rx="2" fill="#5a3f17" stroke="${color}" stroke-width="0.8"/>`;
    g += `<text x="${el.x}" y="${el.y-22*EL_SCALE}" text-anchor="middle" font-size="${6.5*EL_SCALE}" fill="${color}" font-family="var(--mono)" font-weight="bold">LB</text>`;
  }
  g += `</g>`;
  // Sync-check relay indicator (tie switches only) — clickable in toggle mode
  if(def.tieSwitch){
    const syncOk = el.syncOk;
    const sc = syncOk ? '#3ddc84' : '#ff5d5d';
    const sbg = syncOk ? '#1f5d3c' : '#5a2030';
    g += `<g data-sync-el="${el.id}" style="cursor:${tt?'pointer':'default'}">`;
    g += `<rect x="${el.x-18*EL_SCALE}" y="${el.y-44*EL_SCALE}" width="${36*EL_SCALE}" height="${13*EL_SCALE}" rx="3" fill="${sbg}" stroke="${sc}" stroke-width="1"/>`;
    g += `<text x="${el.x}" y="${el.y-34*EL_SCALE}" text-anchor="middle" font-size="${7*EL_SCALE}" fill="${sc}" font-family="var(--mono)" font-weight="bold">${syncOk?'SYNC OK':'SYNC FAIL'}</text>`;
    g += `</g>`;
  }
  if(isoSet.has(el)) g += `<circle cx="${el.x}" cy="${el.y}" r="${22*EL_SCALE}" fill="none" stroke="#ff5d5d" stroke-width="2" stroke-dasharray="3,2"/>`;
  return g;
}

function busGlyph(el, visited, reachBy){
  const {top,bottom} = busTopBottom(el);
  const energized = visited.has(el.id);
  const parallel = energized && reachBy[el.id] && reachBy[el.id].size > 1;
  const color = parallel ? '#c084fc' : energized ? '#3ddc84' : '#7a8fa8';
  return `
    <line x1="${el.x}" y1="${top}" x2="${el.x}" y2="${bottom}" stroke="${color}" stroke-width="4" stroke-linecap="round"/>
    <line x1="${el.x-6}" y1="${top}" x2="${el.x+6}" y2="${top}" stroke="var(--ink-faint)" stroke-width="2"/>
    <line x1="${el.x-6}" y1="${bottom}" x2="${el.x+6}" y2="${bottom}" stroke="var(--ink-faint)" stroke-width="2"/>
  `;
}

function sourceGlyph(el){
  const active = el.active !== false;
  const color = active ? '#3ddc84' : '#7a8fa8';
  const tt = activeTool === 'toggle';
  return `<g data-toggle-el="${el.id}" data-toggle-sub="active" style="cursor:${tt?'pointer':'default'}">
    ${active ? `<circle cx="${el.x}" cy="${el.y}" r="${13*EL_SCALE}" fill="none" stroke="#3ddc84" stroke-width="1" opacity="0.4"/>` : ''}
    <circle cx="${el.x}" cy="${el.y}" r="${9*EL_SCALE}" fill="${color}" stroke="${color}" stroke-width="1"/>
    <line x1="${el.x-4*EL_SCALE}" y1="${el.y}" x2="${el.x+4*EL_SCALE}" y2="${el.y}" stroke="#0b1320" stroke-width="1.5"/>
    ${active ? `<line x1="${el.x}" y1="${el.y-4*EL_SCALE}" x2="${el.x}" y2="${el.y+4*EL_SCALE}" stroke="#0b1320" stroke-width="1.5"/>` : ''}
  </g>`;
}

function loadGlyph(el, visited, reachBy){
  const energized = visited.has(el.id);
  const parallel = energized && reachBy[el.id] && reachBy[el.id].size > 1;
  const color = parallel ? '#c084fc' : energized ? '#3ddc84' : '#7a8fa8';
  const x = el.x, y = el.y;
  const h = 9*EL_SCALE;
  // Square symbol like source but with a horizontal bar (load, non-toggleable)
  return `<g>
    <rect x="${x-h}" y="${y-h}" width="${h*2}" height="${h*2}" fill="${color}" stroke="${color}" stroke-width="1"/>
    <line x1="${x-4*EL_SCALE}" y1="${y}" x2="${x+4*EL_SCALE}" y2="${y}" stroke="#0b1320" stroke-width="2"/>
  </g>`;
}

// Escape text for safe embedding inside SVG markup
function escapeXml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Render possibly multi-line text (split on \n) as stacked, centred tspans.
// cy is treated as the vertical centre of the whole text block for multi-line
// text, and as the baseline for single-line text (matching prior behaviour).
function svgMultilineText(x, cy, text, fontSize, extraAttrs=''){
  const lines = String(text).split('\n');
  if(lines.length <= 1){
    return `<text x="${x}" y="${cy}" ${extraAttrs}>${escapeXml(lines[0]||'')}</text>`;
  }
  const lineHeight = fontSize * 1.25;
  const totalH = (lines.length-1) * lineHeight;
  const firstY = cy - totalH/2;
  let out = `<text x="${x}" y="${firstY}" ${extraAttrs}>`;
  lines.forEach((line,i)=>{
    out += `<tspan x="${x}"${i===0?'':` dy="${lineHeight}"`}>${escapeXml(line)}</tspan>`;
  });
  out += `</text>`;
  return out;
}

// Height (px) a label block will occupy given its font size and line count
function textBlockHeight(text, fontSize){
  const n = String(text||'').split('\n').length;
  return Math.max(fontSize, n * fontSize * 1.25);
}

function textBoxGlyph(el){
  const text = el.name || 'Double-click to edit';
  const hasText = !!el.name;
  const fs = el.labelFontSize||10;
  return svgMultilineText(el.x, el.y+4, text, fs,
    `text-anchor="middle" font-family="var(--mono)" style="font-size:${fs}px;user-select:none" fill="${hasText ? '#e6edf7' : '#5a6e8f'}"`);
}

function junctionGlyph(el, visited, reachBy){
  const energized = visited.has(el.id);
  const parallel = energized && reachBy[el.id] && reachBy[el.id].size > 1;
  const color = parallel ? '#c084fc' : energized ? '#3ddc84' : '#7a8fa8';
  return `<circle cx="${el.x}" cy="${el.y}" r="${5*EL_SCALE}" fill="${color}" stroke="#0b1320" stroke-width="1.5"/>`;
}

function glyphFor(el, isoSet, visited, reachBy){
  const def = TYPES[el.type];
  if(def.kind==='recloser') return recloserExact(el, isoSet);
  if(def.kind==='switch') return def.tripsaver ? tripsaverGlyph(el, isoSet) : el.type==='fuse' ? fuseGlyph(el, isoSet) : switchBladeGlyph(el, isoSet);
  if(def.kind==='bus') return busGlyph(el, visited, reachBy);
  if(def.kind==='source') return sourceGlyph(el);
  if(def.kind==='junction') return junctionGlyph(el, visited, reachBy);
  if(def.kind==='load') return loadGlyph(el, visited, reachBy);
  if(def.kind==='textBox') return ''; // rendered in label pass 2
  return '';
}

function hitAreaFor(el){
  const def = TYPES[el.type];
  if(def.kind==='bus'){
    const {top,bottom} = busTopBottom(el);
    return `<rect x="${el.x-12}" y="${top}" width="24" height="${bottom-top}" fill="transparent"/>`;
  }
  if(def.kind==='source') return `<circle cx="${el.x}" cy="${el.y}" r="${16*EL_SCALE}" fill="transparent"/>`;
  if(def.kind==='load') return `<circle cx="${el.x}" cy="${el.y}" r="${14*EL_SCALE}" fill="transparent"/>`;
  if(def.kind==='textBox') return `<rect x="${el.x-65}" y="${el.y-14}" width="130" height="20" fill="transparent"/>`;
  return ''; // recloser/switch glyphs already include their own hit areas
}

function labelY(el){
  const def = TYPES[el.type];
  if(def.kind==='bus') return busTopBottom(el).bottom + 14*EL_SCALE;
  if(def.kind==='recloser') return el.y + 9*def.scale + 16;
  if(def.kind==='source') return el.y + 22*EL_SCALE;
  if(def.kind==='load') return el.y + 20*EL_SCALE;
  return el.y + 22;
}

/* ============================================================
   NAME EDITING (inline input, avoids blocked prompt() dialogs)
   ============================================================ */
function startNameEdit(elId, x, y){
  const existing = document.getElementById('nameEditorWrap');
  if(existing) existing.remove();
  const el = elements.find(e=>e.id===elId);
  if(!el) return;
  const isTextBox = TYPES[el.type].kind === 'textBox';

  // Convert SVG canvas coordinates → screen pixels
  const rect = stage.getBoundingClientRect();
  const vw = CANVAS_W / vZoom, vh = CANVAS_H / vZoom;
  const stageX = (x - vPanX) / vw * rect.width;
  const stageY = (y - vPanY) / vh * rect.height;

  // Wrapper holds text input + font size buttons
  const wrap = document.createElement('div');
  wrap.id = 'nameEditorWrap';
  Object.assign(wrap.style, {
    position:'absolute', left:(stageX-70)+'px', top:(stageY-34)+'px',
    zIndex:100, display:'flex', flexDirection:'column', alignItems:'center', gap:'4px',
  });

  // Font size buttons row
  const sizeRow = document.createElement('div');
  Object.assign(sizeRow.style, { display:'flex', gap:'3px' });
  LABEL_FONT_SIZES.forEach(sz=>{
    const btn = document.createElement('button');
    btn.textContent = ['S','M','L','XL'][LABEL_FONT_SIZES.indexOf(sz)];
    const active = (el.labelFontSize || 10) === sz;
    Object.assign(btn.style, {
      fontFamily:'var(--mono)', fontSize:'10px', padding:'2px 6px',
      background: active ? 'var(--accent-dim)' : 'var(--panel)',
      color: active ? 'var(--accent)' : 'var(--ink-dim)',
      border:`1px solid ${active?'var(--accent)':'var(--line-grid)'}`,
      borderRadius:'3px', cursor:'pointer',
    });
    btn.addEventListener('mousedown', e=>{
      e.preventDefault(); // keep focus on text input
      el.labelFontSize = sz;
      // Refresh button styles
      sizeRow.querySelectorAll('button').forEach((b,i)=>{
        const isSel = LABEL_FONT_SIZES[i]===sz;
        b.style.background = isSel ? 'var(--accent-dim)' : 'var(--panel)';
        b.style.color = isSel ? 'var(--accent)' : 'var(--ink-dim)';
        b.style.border = `1px solid ${isSel?'var(--accent)':'var(--line-grid)'}`;
      });
      render();
    });
    sizeRow.appendChild(btn);
  });

  const textarea = document.createElement('textarea');
  textarea.id = 'nameEditorInput';
  textarea.value = el.name || '';
  textarea.placeholder = isTextBox ? 'Enter text...\n(Enter for new line)' : TYPES[el.type].label;
  const lineCount = Math.max(1, (textarea.value.match(/\n/g)||[]).length + 1);
  Object.assign(textarea.style, {
    width:'150px', minHeight:(16*Math.min(lineCount,4)+8)+'px', fontSize:'11px', fontFamily:'var(--mono)',
    background:'var(--panel-2)', color:'var(--ink)',
    border:'1px solid var(--accent)', borderRadius:'3px',
    padding:'4px', outline:'none', textAlign:'center',
    resize:'vertical', lineHeight:'1.3',
  });

  // Small "Done" button — explicit commit alternative to clicking away
  const doneBtn = document.createElement('button');
  doneBtn.textContent = '✓ Done';
  Object.assign(doneBtn.style, {
    fontFamily:'var(--mono)', fontSize:'10px', padding:'3px 10px',
    background:'var(--accent-dim)', color:'var(--accent)',
    border:'1px solid var(--accent)', borderRadius:'3px', cursor:'pointer',
  });

  wrap.appendChild(sizeRow);
  wrap.appendChild(textarea);
  wrap.appendChild(doneBtn);
  stage.appendChild(wrap);
  textarea.focus(); textarea.select();

  function commit(){
    el.name = textarea.value.replace(/^\n+|\n+$/g,''); // trim only leading/trailing blank lines
    wrap.remove();
    render();
  }
  textarea.addEventListener('blur', ()=>{
    setTimeout(()=>{ if(!wrap.contains(document.activeElement)) commit(); }, 100);
  });
  textarea.addEventListener('keydown', e=>{
    // Enter inserts a new line (default textarea behaviour) — Escape cancels
    if(e.key==='Escape'){ e.preventDefault(); wrap.remove(); }
  });
  doneBtn.addEventListener('mousedown', e=>{ e.preventDefault(); commit(); });
}

    });

    swatch.addEventListener('mouseleave', ()=>{ swatch.style.transform=''; });

function onStageClick(evt){
  const nameTarget = evt.target.closest('[data-name-el]');
  if(nameTarget){
    startNameEdit(nameTarget.dataset.nameEl, parseFloat(nameTarget.dataset.x), parseFloat(nameTarget.dataset.y));
    return;
  }

  const p = svgPoint(evt);

  if(activeTool === 'delete'){
    const elTarget = evt.target.closest('[data-el-id]');
    const lnTarget = evt.target.closest('[data-line-id]');
    const nameTarget = evt.target.closest('[data-name-el]');
    // Allow deleting textBox elements by clicking their text
    if(nameTarget){
      const el = elements.find(e=>e.id===nameTarget.dataset.nameEl);
      if(el && TYPES[el.type].kind==='textBox'){
        elements = elements.filter(e=>e.id!==el.id);
        render();
        return;
      }
    }
    if(elTarget){
      const id = elTarget.dataset.elId;
      const el = elements.find(e=>e.id===id);
      if(!el) return;
      const ports = TYPES[el.type].kind==='junction' ? [id] : [id, id+'_L', id+'_R'];
      elements = elements.filter(e=>e.id!==id);
      // If deleting a junction, also remove all lines touching it
      lines = lines.filter(l=> !ports.includes(l.fromNodeId) && !ports.includes(l.toNodeId));
      render();
    } else if(lnTarget){
      lines = lines.filter(l=>l.id!==lnTarget.dataset.lineId);
      render();
    }
    return;
  }

  if(activeTool === 'rotate'){
    const elTarget = evt.target.closest('[data-el-id]');
    if(elTarget){
      const el = elements.find(e=>e.id===elTarget.dataset.elId);
      if(el){ el.rotation = ((el.rotation||0) + 90) % 360; render(); }
    }
    return;
  }

  if(activeTool === 'toggle'){
    // Feeder colour picker — click feeder recloser box body
    const fcTarget = evt.target.closest('[data-feeder-color-el]');
    if(fcTarget){
      const rect = stage.getBoundingClientRect();
      showFeederColorPicker(fcTarget.dataset.feederColorEl, evt.clientX-rect.left, evt.clientY-rect.top);
      return;
    }
    // Ground Trip bypass click (on reclosers)
    const gtTarget = evt.target.closest('[data-gt-el]');
    if(gtTarget){
      const el = elements.find(e=>e.id===gtTarget.dataset.gtEl);
      if(el){
        el.groundTripBypassed = !el.groundTripBypassed;
        const state = el.groundTripBypassed ? 'BYPASSED' : 'ACTIVE';
        logEvent(`${elName(el)}: Ground Trip → ${state}${el.groundTripBypassed ? ' — ground trip protection disabled, safe to operate knife switches' : ' — ground trip protection re-enabled'}`, el.groundTripBypassed ? 'warn' : 'ok');
        render();
      }
      return;
    }
    // Sync-check relay click (on tie switches)
    const syncTarget = evt.target.closest('[data-sync-el]');
    if(syncTarget){
      const el = elements.find(e=>e.id===syncTarget.dataset.syncEl);
      if(el && el.syncOk !== undefined){
        el.syncOk = !el.syncOk;
        logEvent(`${elName(el)}: Sync-check relay → ${el.syncOk ? 'SYNC OK' : 'SYNC FAIL'}`, el.syncOk ? 'ok' : 'blocked');
        render();
      }
      return;
    }
    const target = evt.target.closest('[data-toggle-el]');
    if(target){
      const elId = target.dataset.toggleEl, sub = target.dataset.toggleSub;
      const el = elements.find(e=>e.id===elId);
      const def = TYPES[el.type];
      if(def.kind==='source'){
        el.active = !el.active; // silent toggle — not logged
        render();
        return;
      }
      if(def.kind==='recloser') attemptToggleRecloser(elId, sub);
      else attemptToggleSwitch(elId);
      render();
    }
    return;
  }

  if(activeTool === 'line'){
    const snap = findSnapTarget(p.x, p.y);
    const lineSnap = !snap ? findLineSnap(p.x, p.y) : null;

    let point, nodeId;
    if(snap){
      point = snap.point; nodeId = snap.nodeId;
    } else if(lineSnap){
      nodeId = splitLineAtPoint(lineSnap.lineId, lineSnap.segIdx, lineSnap.point);
      point = lineSnap.point;
    } else {
      // Snap to grid for free points
      point = snapToGrid(p); nodeId = null;
    }

    if(!lineDraft){
      lineDraft = { points:[point], fromNodeId: nodeId, lockedAxis: null };
      render();
      return;
    }

    const lastFixed = lineDraft.points[lineDraft.points.length-1];
    // Orthogonal constrain from last fixed point, then snap to grid
    let constrained = (snap||lineSnap) ? point : orthogonalConstrain(lastFixed, snapToGrid(p));
    lineDraft.points.push(constrained);

    if(snap || lineSnap){
      lines.push({ id:'ln'+(nextId++), points: lineDraft.points.slice(), fromNodeId: lineDraft.fromNodeId, toNodeId: nodeId });
      lineDraft = null;
    }
    render();
    return;
  }

  if(TYPES[activeTool]){
    const gp = snapToGrid(p);
    elements.push(newElement(activeTool, gp.x, gp.y));
    render();
    return;
  }
}

function isPortOfSelected(nodeId){
  for(const id of selectedIds){
    if(nodeId===id || nodeId===id+'_L' || nodeId===id+'_R') return true;
  }
  return false;
}

function onStageMove(evt){
  mousePos = svgPoint(evt);
  // Label drag — free movement, no snapping
  if(labelDragState){
    const el = elements.find(e=>e.id===labelDragState.elId);
    if(el){
      if(!el.labelOffset) el.labelOffset = {x:0,y:0};
      el.labelOffset.x = labelDragState.startOffX + (mousePos.x - labelDragState.startMouseX);
      el.labelOffset.y = labelDragState.startOffY + (mousePos.y - labelDragState.startMouseY);
      render();
    }
    return;
  }
  if(activeTool === 'select'){
    if(dragState){
      const rawDx = mousePos.x - dragState.startX;
      const rawDy = mousePos.y - dragState.startY;
      const gridDx = Math.round(rawDx / GRID) * GRID;
      const gridDy = Math.round(rawDy / GRID) * GRID;
      elements.forEach(el=>{
        if(!dragState.elSnapshots[el.id]) return;
        el.x = dragState.elSnapshots[el.id].x + gridDx;
        el.y = dragState.elSnapshots[el.id].y + gridDy;
      });
      lines.forEach(ln=>{
        const snap = dragState.lineSnapshots.find(s=>s.id===ln.id);
        if(!snap) return;
        const fromSel = isPortOfSelected(ln.fromNodeId);
        const toSel   = isPortOfSelected(ln.toNodeId);
        snap.points.forEach((sp, i)=>{
          const isFirst = i===0, isLast = i===snap.points.length-1;
          const move = (isFirst && fromSel) || (isLast && toSel) || (fromSel && toSel);
          ln.points[i].x = move ? sp.x + gridDx : sp.x;
          ln.points[i].y = move ? sp.y + gridDy : sp.y;
        });
      });
      render(); return;
    }
    if(selectBox){
      selectBox.x2 = mousePos.x; selectBox.y2 = mousePos.y; render(); return;
    }
  }
  if(activeTool === 'line' && lineDraft){
    updateRubberBand();
  } else if(TYPES[activeTool]){
    // Show grid-snap preview crosshair while placing elements
    const gp = snapToGrid(mousePos);
    const dot = document.getElementById('placeDot');
    if(dot){
      dot.setAttribute('cx', gp.x); dot.setAttribute('cy', gp.y);
      dot.setAttribute('visibility','visible');
    }
  } else {
    const dot = document.getElementById('placeDot');
    if(dot) dot.setAttribute('visibility','hidden');
  }
}
function updateRubberBand(){
  const rb = document.getElementById('rubberLine');
  const snapDot = document.getElementById('snapDot');
  if(!rb || !lineDraft || !mousePos) return;
  const lastFixed = lineDraft.points[lineDraft.points.length-1];
  const snap = findSnapTarget(mousePos.x, mousePos.y);
  const lineSnap = !snap ? findLineSnap(mousePos.x, mousePos.y) : null;
  let preview;
  if(snap) preview = snap.point;
  else if(lineSnap) preview = lineSnap.point;
  else preview = orthogonalConstrain(lastFixed, snapToGrid(mousePos));
  rb.setAttribute('points', lineDraft.points.concat([preview]).map(p=>`${p.x},${p.y}`).join(' '));
  if(snapDot){
    snapDot.setAttribute('cx', preview.x);
    snapDot.setAttribute('cy', preview.y);
    snapDot.setAttribute('visibility', 'visible');
  }
}

/* ============================================================
   GEOMETRY HELPERS FOR DE-ENERGIZED REGION OUTLINE
   ============================================================ */
function cross(O,A,B){ return (A.x-O.x)*(B.y-O.y)-(A.y-O.y)*(B.x-O.x); }

function convexHull(points){
  const pts = [...points].sort((a,b)=>a.x!==b.x?a.x-b.x:a.y-b.y);
  const n = pts.length;
  if(n<3) return pts;
  const lower=[], upper=[];
  for(const p of pts){
    while(lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],p)<=0) lower.pop();
    lower.push(p);
  }
  for(let i=n-1;i>=0;i--){
    const p=pts[i];
    while(upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],p)<=0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return [...lower,...upper];
}

// Smooth closed SVG path through points using quadratic bezier midpoints
function smoothClosedPath(pts){
  const n=pts.length;
  if(n<2) return '';
  let d=`M ${(pts[0].x+pts[n-1].x)/2} ${(pts[0].y+pts[n-1].y)/2}`;
  for(let i=0;i<n;i++){
    const p1=pts[i], p2=pts[(i+1)%n];
    d+=` Q ${p1.x} ${p1.y} ${(p1.x+p2.x)/2} ${(p1.y+p2.y)/2}`;
  }
  return d+' Z';
}

function renderLegend(){
  const lx = 22, ly = 22;
  const pad = 8;

  function miniRecloser(cx, cy, energized){
    const W = 35; // half of original 70
    const s = W / 385;
    const tx = lx2 => cx - W/2 + s*lx2;
    const ty = ly2 => cy + s*(ly2 - 47.5);
    const c  = energized ? '#3ddc84' : '#7a8fa8';
    const ci = '#5a6e8f';

    let g = '';
    g += `<line x1="${tx(0)}"   y1="${ty(0)}"  x2="${tx(145)}" y2="${ty(0)}"  stroke="${ci}" stroke-width="0.7"/>`;
    g += `<line x1="${tx(243)}" y1="${ty(0)}"  x2="${tx(385)}" y2="${ty(0)}"  stroke="${ci}" stroke-width="0.7"/>`;
    g += `<line x1="${tx(0)}"   y1="${ty(95)}" x2="${tx(385)}" y2="${ty(95)}" stroke="${ci}" stroke-width="0.7"/>`;
    g += `<line x1="${tx(0)}"   y1="${ty(0)}"  x2="${tx(0)}"   y2="${ty(95)}" stroke="${ci}" stroke-width="0.7"/>`;
    g += `<line x1="${tx(385)}" y1="${ty(0)}"  x2="${tx(385)}" y2="${ty(95)}" stroke="${ci}" stroke-width="0.7"/>`;
    g += `<line x1="${tx(145)}" y1="${ty(0)}"  x2="${tx(245)}" y2="${ty(-51)}" stroke="${c}" stroke-width="0.8"/>`;
    g += `<line x1="${tx(46)}"  y1="${ty(147)}" x2="${tx(102)}" y2="${ty(46)}" stroke="${c}" stroke-width="1"/>`;
    g += `<line x1="${tx(145)}" y1="${ty(49)}"  x2="${tx(245)}" y2="${ty(144)}" stroke="${c}" stroke-width="1"/>`;
    g += `<line x1="${tx(245)}" y1="${ty(49)}"  x2="${tx(145)}" y2="${ty(144)}" stroke="${c}" stroke-width="1"/>`;
    g += `<line x1="${tx(293)}" y1="${ty(147)}" x2="${tx(338)}" y2="${ty(46)}" stroke="${c}" stroke-width="1"/>`;
    if(!energized){
      g += `<circle cx="${cx}" cy="${cy}" r="${W*0.62}" fill="none"
        stroke="#ff5d5d" stroke-width="1" stroke-dasharray="3,2"/>`;
    }
    return g;
  }

  const symW = 35, symH = 26;
  const row1y = ly + 18;
  const row2y = row1y + symH + 16;
  const symX  = lx + pad + symW/2;
  const labelX = symX + symW/2 + 6;
  const boxH   = (row2y + symH/2 + pad) - ly;
  const boxW   = symW + 80;

  let g = '';
  g += `<rect x="${lx}" y="${ly}" width="${boxW}" height="${boxH}" rx="4"
    fill="#0b1320" stroke="#1c2942" stroke-width="1" opacity="0.95"/>`;
  g += `<text x="${lx+boxW/2}" y="${ly+9}" text-anchor="middle" font-size="6.5"
    fill="#8ea0bd" font-family="var(--mono)" font-weight="bold" letter-spacing="0.06em">LEGEND</text>`;

  g += miniRecloser(symX, row1y, false);
  g += `<text x="${labelX}" y="${row1y+3}" font-size="7.5" fill="#ff5d5d" font-family="var(--mono)">De-energized</text>`;

  g += miniRecloser(symX, row2y, true);
  g += `<text x="${labelX}" y="${row2y+3}" font-size="7.5" fill="#3ddc84" font-family="var(--mono)">Energized</text>`;

  return g;
}

/* ============================================================
   RENDER
   ============================================================ */
function lineStroke(ln, visited, reachBy, nodeColor){
  const energized = visited.has(ln.fromNodeId) && visited.has(ln.toNodeId);
  if(!energized) return {color:'#7a8fa8', width:2.5};
  const rs = new Set([...(reachBy[ln.fromNodeId]||[]), ...(reachBy[ln.toNodeId]||[])]);
  if(rs.size > 1) return {color:'#c084fc', width:3.5};
  const fc = nodeColor && (nodeColor[ln.toNodeId] || nodeColor[ln.fromNodeId]);
  return {color: fc || '#3ddc84', width:2.5};
}

function renderFeederList(){
  const el = document.getElementById('feederList');
  if(!el) return;
  const feeders = elements.filter(e=>e.type==='feederRecloser');
  if(!feeders.length){ el.innerHTML='<div class="empty-state">No feeder reclosers placed.</div>'; return; }
  el.innerHTML = feeders.map(f=>{
    const color = feederColorMap[f.id] || '#3ddc84';
    const visible = feederVisibility[f.id] !== false;
    const name = f.name || f.id;

      <span class="feeder-swatch" style="background:${color}"></span>
      <span style="color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name}</span>
      <span class="feeder-eye" data-feeder-toggle="${f.id}" title="${visible?'Hide':'Show'} feeder">${visible?'👁':'👁‍🗨'}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-feeder-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const fid = btn.dataset.feederToggle;
